# MySQL address, user and password
# user must have replication privilege in MySQL.
my_addr = "mysql-svc:80"
my_user = "river"
my_pass = "riverPassword"
my_charset = "utf8"

# Elasticsearch address
es_addr = "elasticsearch-service:9200"
es_user = ""
es_pass = ""

# Path to store data, like master.info, if not set or empty,
# we must use this to support breakpoint resume syncing.
data_dir = "./var"

# Inner Http status address
stat_addr = "0.0.0.0:12800"
stat_path = "/metrics"

# pseudo server id like a slave
server_id = 1001

# mysql or mariadb
flavor = "mysql"

# mysqldump execution path
mysqldump = "mysqldump"

# MySQL 8.4 removed "SHOW MASTER STATUS"; mysqldump's --master-data still uses it
# and fails. Skip it and let the Go driver fetch the binlog position instead
# (it picks the right command based on server version).
skip_master_data = true

# minimal items to be inserted in one bulk
bulk_size = 128

# force flush the pending requests if we don't have enough items >= bulk_size
flush_bulk_time = "200ms"

# Ignore table without primary key
skip_no_pk_table = true

[[source]]
schema = "banking_service"
tables = ["*"]

[[source]]
schema = "basket_service"
tables = ["*"]

[[source]]
schema = "notification_service"
tables = ["*"]
