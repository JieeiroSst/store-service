apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-river-config
data:
  river.toml: |
    my_addr = "mysql-svc:80"
    my_user = "river"
    my_pass = "riverPassword"
    my_charset = "utf8"

    es_addr = "elasticsearch-service:9200"
    es_user = ""
    es_pass = ""

    data_dir = "/var/lib/river"

    stat_addr = "0.0.0.0:12800"
    stat_path = "/metrics"

    server_id = 1001

    flavor = "mysql"

    mysqldump = "mysqldump"

    skip_master_data = true

    bulk_size = 128

    flush_bulk_time = "200ms"

    skip_no_pk_table = true

    [[source]]
    schema = "banking_service"
    tables = ["*"]

    [[source]]
    schema = "basket_service"
    tables = ["*"]

    [[source]]
    schema = "notification_service"
    tables = ["*"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-river
  labels:
    app: mysql-river
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-river
  template:
    metadata:
      labels:
        app: mysql-river
    spec:
      containers:
        - name: mysql-river
          image: sync-mysql-es:v4
          imagePullPolicy: IfNotPresent
          args: ["-config=/etc/river/river.toml"]
          ports:
            - containerPort: 12800
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/river
            - name: data
              mountPath: /var/lib/river
      volumes:
        - name: config
          configMap:
            name: mysql-river-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-river-service
spec:
  ports:
    - port: 12800
      targetPort: 12800
      nodePort: 30084
  type: NodePort
  selector:
    app: mysql-river
