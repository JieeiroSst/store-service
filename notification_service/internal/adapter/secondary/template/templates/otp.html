{{define "subject"}}Mã xác thực của bạn: {{.OTP}}{{end}}
{{define "html"}}
<!DOCTYPE html>
<html>
  <body style="font-family: sans-serif; color: #1a1a1a;">
    <h2>Xin chào {{.Name}},</h2>
    <p>Mã xác thực (OTP) của bạn là:</p>
    <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px;">{{.OTP}}</p>
    <p>Mã có hiệu lực trong {{.ExpiresIn}} phút. Vui lòng không chia sẻ mã này với bất kỳ ai.</p>
  </body>
</html>
{{end}}
