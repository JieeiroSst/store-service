gatewayService:
  name: gateway-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/gateway-service
    tag: latest
    # Must match config.Server.PortServer as resolved from Consul (see
    # restaurant/gateway-service/config/config.go and consul.json).
    port: 1234

  service:
    name: gateway-service-svc
    type: LoadBalancer

  # gateway-service is the cluster's entry point per restaurant.drawio.png,
  # so ingress is the most likely candidate to flip on for this chart.
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: gateway-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
