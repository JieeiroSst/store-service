apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.toolService.name }}-deployment
spec:
  replicas: {{ .Values.toolService.replicas }}
  # The experience store lives on a ReadWriteOnce volume: the old pod must release
  # it before the new one starts, so a rolling update would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.toolService.name }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.toolService.name }}-deployment
    spec:
      containers:
      - name: {{ .Values.toolService.name }}-deployment
        image: {{ .Values.toolService.image.name }}:{{ .Values.toolService.image.tag }}
        imagePullPolicy: {{ .Values.toolService.image.pullPolicy | default "Always" }}
        ports:
        - name: http
          containerPort: {{ .Values.toolService.image.httpPort }}
        env:
          - name: HTTP_PORT
            value: "{{ .Values.toolService.image.httpPort }}"
          - name: OLLAMA_URL
            value: "{{ .Values.toolService.ollama.url }}"
          - name: OLLAMA_MODEL
            value: "{{ .Values.toolService.ollama.model }}"
          - name: OLLAMA_EMBED_MODEL
            value: "{{ .Values.toolService.ollama.embedModel }}"
          - name: CONSISTENCY_RUNS
            value: "{{ .Values.toolService.learning.consistencyRuns }}"
          - name: AUTO_LEARN_INTERVAL
            value: "{{ .Values.toolService.learning.autoLearnInterval }}"
          - name: LEARNING_DATA_DIR
            value: /data
          {{- if .Values.toolService.android.adbServerAddress }}
          - name: ANDROID_ADB_SERVER_ADDRESS
            value: {{ .Values.toolService.android.adbServerAddress | quote }}
          - name: ANDROID_ADB_SERVER_PORT
            value: {{ .Values.toolService.android.adbServerPort | quote }}
          {{- end }}
          - name: CHROME_PATH
            value: /headless-shell/headless-shell
          - name: CHROME_NO_SANDBOX
            value: "true"
          - name: DB_CONNECTIONS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.toolService.connectionsSecret.name }}
                key: {{ .Values.toolService.connectionsSecret.dbKey }}
                optional: true
          - name: RABBITMQ_CONNECTIONS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.toolService.connectionsSecret.name }}
                key: {{ .Values.toolService.connectionsSecret.rabbitKey }}
                optional: true
          - name: API_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.toolService.apiTokenSecret.name }}
                key: {{ .Values.toolService.apiTokenSecret.key }}
                optional: true
          - name: TARGET_ALLOWLIST
            value: "{{ .Values.toolService.targetAllowlist }}"
        resources:
          {{- toYaml .Values.toolService.resources | nindent 10 }}
        volumeMounts:
        - name: learning-data
          mountPath: /data
        # Chromium needs a large /dev/shm or tabs crash on big pages
        - name: dshm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.toolService.image.httpPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.toolService.image.httpPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: learning-data
        persistentVolumeClaim:
          claimName: {{ .Values.toolService.name }}-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.toolService.name }}-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.toolService.learning.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.toolService.service.name }}
spec:
  type: {{ .Values.toolService.service.type }}
  ports:
  - port: 80
    targetPort: {{ .Values.toolService.image.httpPort }}
  selector:
    app: {{ .Values.toolService.name }}-deployment
