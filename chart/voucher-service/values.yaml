# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
voucherService:
  name: voucher-service
  selectorApp: voucher-service-deployment
  containerName: voucher-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/voucher-service
    tag: latest
    # Must match the PORT env var voucher-service reads (see
    # internal/platform/config), default 3000.
    port: 3000
    pullPolicy: Always
    httpPort: 3000

  service:
    name: voucher-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: voucher-service.local
    path: /
    pathType: Prefix

    tls:
      enabled: false
      secretName: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT
      value: '{{ .Values.voucherService.image.httpPort }}'
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.voucherService.credentialsSecret }}'
          key: POSTGRES_USER
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.voucherService.credentialsSecret }}'
          key: POSTGRES_PASSWORD
  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: 'voucher-service-db-credentials'
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
  # No Consul config (CONSUL_ENABLED=false): settings come from this .env and
  # the database login from the postgres-provisioned Secret below.
  envFile:
    enabled: true
    mountPath: /app/.env
    content: |
      # Read through godotenv (internal/platform/config); container env wins.
      CONSUL_ENABLED=false
      POSTGRES_HOST=postgresdb
      POSTGRES_PORT=80
      POSTGRES_DBNAME=voucher
      POSTGRES_SSL_MODE=disable
      REDIS_HOST=redis-svc
      REDIS_PORT=80
      REDIS_DB=0
      KAFKA_BROKERS=kafka-service:9092
      USER_SERVICE_URL=http://user-api-svc
      USER_SERVICE_TIMEOUT_MS=3000
      OUTBOX_RELAY_INTERVAL_MS=500
      VOUCHER_EXPIRY_SWEEP_MINUTES=5
  credentialsSecret: voucher-service-db-credentials
