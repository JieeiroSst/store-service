voucherService:
  name: voucher-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/voucher-service
    tag: latest
    # Must match the PORT env var voucher-service reads (see
    # internal/platform/config), default 3000.
    httpPort: 3000

  service:
    name: voucher-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: voucher-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
