# Argo CD: namespace store-dev, auto-synced. CI bumps image.tag on every merge to master.
global:
  environment: dev
voucherService:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: true
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
    # Laptop-sized: small requests so ~70 services fit one docker-desktop node;
    # limits from values.yaml still cap each pod.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  externalSecret:
    enabled: true
    data:
      - property: POSTGRES_USER
        remoteKey: voucher-service-db-credentials
        secretKey: POSTGRES_USER
      - property: POSTGRES_PASSWORD
        remoteKey: voucher-service-db-credentials
        secretKey: POSTGRES_PASSWORD
