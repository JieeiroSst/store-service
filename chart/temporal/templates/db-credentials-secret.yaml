{{- $secretName := "temporal-db-credentials" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.temporal.db.password }}
{{- if not $password }}
  {{- if $existing }}
    {{- $password = index $existing.data "POSTGRES_PWD" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 24 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.temporal.db.user | b64enc }}
  POSTGRES_PWD: {{ $password | b64enc }}
