apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.service.name }}
  labels:
    app: {{ .Values.minio.name }}
spec:
  type: NodePort
  ports:
    - name: api
      port: {{ .Values.minio.service.apiPort }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
      nodePort: {{ .Values.minio.service.consoleNodePort }}
  selector:
    app: {{ .Values.minio.name }}
