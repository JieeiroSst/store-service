apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.service.name }}
  labels:
    app: {{ .Values.minio.name }}
spec:
  ports:
    - name: api
      port: {{ .Values.minio.service.apiPort }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
  selector:
    app: {{ .Values.minio.name }}
