apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.minio.name }}
spec:
  replicas: {{ .Values.minio.replicas }}
  # One server per data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.minio.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.minio.name }}
    spec:
      # The image runs as uid 65532; fsGroup makes the data volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        # The data volume is a hostPath PersistentVolume (persistent-volume.yaml),
        # which ignores fsGroup: hand the directory to the minio user once.
        - name: data-permissions
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 65532:65532 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: minio-data
              mountPath: /data
      containers:
        - name: {{ .Values.minio.name }}
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.service.consolePort }}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
          # Generous timeouts: on a CPU-starved node the health endpoints can
          # take seconds to answer, and the 1s default got MinIO killed by its
          # liveness probe in a restart loop. The startup probe holds liveness
          # off until the server has come up once.
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-persistent-volume-claim
