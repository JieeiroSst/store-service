apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.minio.name }}-persistent-volume
  labels:
    type: local
    app: {{ .Values.minio.name }}
spec:
  storageClassName: manual
  capacity:
    storage: {{ .Values.minio.storage.size }}
  accessModes:
    - ReadWriteMany
  hostPath:
    path: {{ .Values.minio.storage.hostPath | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-persistent-volume-claim
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
