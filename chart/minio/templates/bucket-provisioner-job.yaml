# Creates every bucket in minio.buckets on install/upgrade. mc mb
# --ignore-existing makes this idempotent, safe to run on every upgrade -
# same shape as chart/postgres's service-db-provisioner job.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-provisioner
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provision-buckets
          # minio/mc is no longer published; S3 CreateBucket is a single
          # SigV4-signed PUT, which curl signs itself (--aws-sigv4).
          image: curlimages/curl:8.10.1
          env:
            - name: MINIO_ADDR
              value: "http://{{ .Values.minio.service.name }}:{{ .Values.minio.service.apiPort }}"
            - name: MINIO_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              until curl -sf "$MINIO_ADDR/minio/health/ready" >/dev/null; do
                echo "waiting for minio..."
                sleep 2
              done
              create() {
                code=$(curl -s -o /tmp/resp -w '%{http_code}' -X PUT \
                  --aws-sigv4 "aws:amz:us-east-1:s3" \
                  --user "$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD" \
                  "$MINIO_ADDR/$1")
                case "$code" in
                  200) echo "created $1" ;;
                  409) echo "exists  $1" ;;
                  *) echo "failed  $1 ($code)"; cat /tmp/resp; return 1 ;;
                esac
              }
              {{- range .Values.minio.buckets }}
              create "{{ . }}"
              {{- end }}
              echo "all buckets provisioned"
