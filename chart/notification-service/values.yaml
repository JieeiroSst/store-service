notificationService:
  name: notification-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/notification-service
    tag: latest
    # Must match config.Server.ServerPort as resolved from Consul, or the
    # PORT env var fallback (see notification_service/config/config.go).
    port: 1235

  service:
    name: notification-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: notification-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
