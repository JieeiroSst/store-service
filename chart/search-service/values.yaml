# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
searchService:
  name: search-service
  selectorApp: search-service
  containerName: search-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/search-service
    tag: latest
    port: 8080
    pullPolicy: IfNotPresent

  service:
    name: search-service-svc
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: search-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: false
  consul:
    addr: http://consul-service
    key: search-service
  containerEnv:
    - name: CONSUL_ADDR
      value: '{{ .Values.searchService.consul.addr }}'
    - name: CONSUL_KEY
      value: '{{ .Values.searchService.consul.key }}'
    - name: PORT_HTTP_SERVER
      value: '{{ .Values.searchService.image.port }}'
  envFile:
    enabled: false
  # /health pings Elasticsearch (readiness); /livez only checks the process.
  probes:
    startup:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
  # Seeds Consul KV `key` from files/consul.json when missing (chart/common).
  consulSeed:
    enabled: true
    key: search-service
