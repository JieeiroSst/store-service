# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
shopifyService:
  name: shopify-service
  selectorApp: shopify-service-deployment
  containerName: shopify-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/shopify-service
    tag: latest
    # Must match config.Server.PortHttpServer as resolved from env/Consul
    # (see shopify-service/config/config.go).
    port: 8092
    pullPolicy: Always

  service:
    name: shopify-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: shopify-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # Plain env vars the container reads directly (see config.FromEnv) - works
  # standalone even before ops has seeded this service's config into the
  # cluster's shared Consul KV store. Credentials below are placeholders only -
  # override with real secrets via --set or a values-prod.yaml.
  env:
    mysqlHost: mysql-svc
    mysqlPort: "80"
    mysqlUser: root
    mysqlPassword: password
    mysqlDbname: shopify_service

    # Permanent store domain, e.g. my-store.myshopify.com
    shopifyShopDomain: ""
    # Quarterly Admin API version (YYYY-MM); keep within Shopify's supported window.
    shopifyAPIVersion: "2026-07"
    shopifyTimeout: 10s
    # Admin API access token of the custom app (shpat_...).
    shopifyAccessToken: ""
    # App client secret, verifies the X-Shopify-Hmac-Sha256 webhook header.
    shopifyAPISecret: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT_HTTP_SERVER
      value: '{{ .Values.shopifyService.image.port }}'
    - name: MYSQL_HOST
      value: '{{ .Values.shopifyService.env.mysqlHost }}'
    - name: MYSQL_PORT
      value: '{{ .Values.shopifyService.env.mysqlPort }}'
    - name: MYSQL_USER
      value: '{{ .Values.shopifyService.env.mysqlUser }}'
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: shopify-service-secret
          key: mysqlPassword
    - name: MYSQL_DBNAME
      value: '{{ .Values.shopifyService.env.mysqlDbname }}'
    - name: SHOPIFY_SHOP_DOMAIN
      value: '{{ .Values.shopifyService.env.shopifyShopDomain }}'
    - name: SHOPIFY_API_VERSION
      value: '{{ .Values.shopifyService.env.shopifyAPIVersion }}'
    - name: SHOPIFY_TIMEOUT
      value: '{{ .Values.shopifyService.env.shopifyTimeout }}'
    - name: SHOPIFY_ACCESS_TOKEN
      valueFrom:
        secretKeyRef:
          name: shopify-service-secret
          key: shopifyAccessToken
    - name: SHOPIFY_API_SECRET
      valueFrom:
        secretKeyRef:
          name: shopify-service-secret
          key: shopifyAPISecret
  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 20

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
  envFile:
    enabled: true
    mountPath: /app/.env
    content: |
      HostConsul="http://consul-service"
      KeyConsul="shopify_service"
      ServiceConsul="consul"
  # Seeds Consul KV `key` from files/consul.json when missing (chart/common).
  consulSeed:
    enabled: true
    key: shopify_service
