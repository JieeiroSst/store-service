# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
arrange:
  name: arrange-service
  selectorApp: arrange-service-deployment
  containerName: arrange-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/arrange-service
    tag: latest
    port: 8080
    pullPolicy: Always

  service:
    name: arrange-service-svc
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: arrange-service.local
    path: /
    pathType: Prefix

    tls:
      enabled: false
      secretName: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  userServiceUrl: http://user-api-svc
  internalTokensSecret:
    enabled: false
    name: internal-api-tokens
    key: INTERNAL_API_TOKENS
  containerEnv:
    - name: USER_SERVICE_URL
      value: '{{ .Values.arrange.userServiceUrl }}'
    - name: INTERNAL_API_TOKENS
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.arrange.internalTokensSecret.name }}'
          key: '{{ .Values.arrange.internalTokensSecret.key }}'
      when: '{{ if .Values.arrange.internalTokensSecret.enabled }}true{{ end }}'
  probes:
    startup:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
