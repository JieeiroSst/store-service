{{- if not .Values.recompenseService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.recompenseService.name }}-secret
type: Opaque
stringData:
  # Dev default from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  postgresPassword: {{ .Values.recompenseService.env.postgresPassword | quote }}
{{- end }}
