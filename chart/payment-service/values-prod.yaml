# Argo CD: namespace store-prod, MANUAL sync. Changes land here only through a
# reviewed PR opened by the "Promote image" workflow.
# Credentials come from the secret manager (SecretStore store-secrets);
# create the store/prod/... keys before the first sync.
global:
  environment: prod
paymentService:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: true
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
  priorityClassName: store-critical
  envFile:
    externalSecret:
      remoteKey: store/prod/payment-service/env-file
      property: env
  externalSecret:
    enabled: true
    targetName: payment-service-secret
    refreshInterval: 15m
    data:
      - secretKey: mysqlPassword
        remoteKey: store/prod/payment-service
        property: mysqlPassword
      - secretKey: payoneerAPIKey
        remoteKey: store/prod/payment-service
        property: payoneerAPIKey
      - secretKey: payoneerWebhookSecret
        remoteKey: store/prod/payment-service
        property: payoneerWebhookSecret
      - secretKey: paypalClientSecret
        remoteKey: store/prod/payment-service
        property: paypalClientSecret
      - secretKey: paypalWebhookID
        remoteKey: store/prod/payment-service
        property: paypalWebhookID
      - secretKey: stripeSecretKey
        remoteKey: store/prod/payment-service
        property: stripeSecretKey
      - secretKey: stripeWebhookSecret
        remoteKey: store/prod/payment-service
        property: stripeWebhookSecret
      - secretKey: wiseAPIToken
        remoteKey: store/prod/payment-service
        property: wiseAPIToken
      - secretKey: wiseWebhookPublicKey
        remoteKey: store/prod/payment-service
        property: wiseWebhookPublicKey
