{{- if not .Values.paymentService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.paymentService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  mysqlPassword: {{ .Values.paymentService.env.mysqlPassword | quote }}
  paypalClientSecret: {{ .Values.paymentService.env.paypalClientSecret | quote }}
  paypalWebhookID: {{ .Values.paymentService.env.paypalWebhookID | quote }}
  payoneerAPIKey: {{ .Values.paymentService.env.payoneerAPIKey | quote }}
  payoneerWebhookSecret: {{ .Values.paymentService.env.payoneerWebhookSecret | quote }}
  stripeSecretKey: {{ .Values.paymentService.env.stripeSecretKey | quote }}
  stripeWebhookSecret: {{ .Values.paymentService.env.stripeWebhookSecret | quote }}
  wiseAPIToken: {{ .Values.paymentService.env.wiseAPIToken | quote }}
  wiseWebhookPublicKey: {{ .Values.paymentService.env.wiseWebhookPublicKey | quote }}
{{- end }}
