apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.lottery.name }}-deployment
spec:
{{- if not .Values.lottery.autoscaling.enabled }}
  replicas: {{ .Values.lottery.replicas }}
{{- end }}
  selector:
    matchLabels:
      app: {{ .Values.lottery.name }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.lottery.name }}-deployment
    spec:
      containers:
      - name: {{ .Values.lottery.name }}-deployment
        image: {{ .Values.lottery.image.name }}:{{ .Values.lottery.image.tag }}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: {{ .Values.lottery.image.port }}
        resources:
          {{- toYaml .Values.lottery.resources | nindent 10 }}
        volumeMounts:
        - name: env-file
          mountPath: /app/.env
          subPath: lottery-service.env
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: env-file
        secret:
          secretName: service-env-files
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.lottery.service.name }}
spec:
  type: {{ .Values.lottery.service.type }}
  ports:
  - name: http
    port: 80
    targetPort: {{ .Values.lottery.image.port }}
  selector:
    app: {{ .Values.lottery.name }}-deployment
