# Bootstrap .env files for services whose Go binaries load config via
# godotenv (see e.g. account-transaction-service/config/config.go). Docker
# images intentionally don't bake in .env (it only carries Consul bootstrap
# vars), so it must be mounted at runtime as a real file at /app/.env -
# setting the equivalent container env vars is not enough for services
# whose config loader treats a missing file as fatal.
#
# Every chart now owns its .env (values `envFile` in chart/common). This
# Secret is kept empty because 19 charts still mount a key from it that never
# existed (volume marked optional) - see deploy/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: service-env-files
type: Opaque
stringData: {}
