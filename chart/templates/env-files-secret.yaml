# Bootstrap .env files for services whose Go binaries load config via
# godotenv (see e.g. account-transaction-service/config/config.go). Docker
# images intentionally don't bake in .env (it only carries Consul bootstrap
# vars), so it must be mounted at runtime as a real file at /app/.env -
# setting the equivalent container env vars is not enough for services
# whose config loader treats a missing file as fatal.
apiVersion: v1
kind: Secret
metadata:
  name: service-env-files
type: Opaque
stringData:
  account-transaction.env: |
    HostConsul="http://consul-service"
    KeyConsul="account_transaction_service"
    ServiceConsul="consul"
  address-country.env: |
    HostConsul="http://consul-service"
    KeyConsul="address_country_service"
    ServiceConsul="consul"
  admanagement.env: |
    HostConsul="http://consul-service"
    KeyConsul="admanagement_service"
    ServiceConsul="consul"
    POSTGRES_HOST=postgresdb
    POSTGRES_PORT=80
    POSTGRES_USER=postgres
    POSTGRES_PASSWORD=postgres
    POSTGRES_DBNAME=admanagement
    POSTGRES_SSLMODE=disable
  airflow-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="airflow_service"
    ServiceConsul="consul"
  authorize-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="authorize_service"
    ServiceConsul="consul"
  automatic-payment-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="automatic_payment_service"
    ServiceConsul="consul"
  banking-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="banking-service"
    ServiceConsul="consul"
  basket-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="basket_service"
    ServiceConsul="consul"
  book-store-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="book_store_service"
    ServiceConsul="consul"
    POSTGRES_HOST=postgresdb
    POSTGRES_PORT=5432
    POSTGRES_USER=postgres
    POSTGRES_PASSWORD=postgres
    POSTGRES_DBNAME=book_store
    POSTGRES_SSLMODE=disable
  billing-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="billing_service"
    ServiceConsul="consul"
  notification-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="notification_service"
    ServiceConsul="consul"
  user-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="user_service"
    ServiceConsul="consul"
  bot-service.env: |
    HostConsul="http://consul-service"
    KeyConsul="bot_service"
    ServiceConsul="consul"
