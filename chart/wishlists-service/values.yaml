# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
wishlistsService:
  name: wishlists-service
  selectorApp: wishlists-service
  containerName: wishlists-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/wishlists-service
    tag: latest
    port: 9000
    pullPolicy: IfNotPresent

  service:
    name: wishlists-service-svc
    type: ClusterIP
    port: 9000
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: wishlists-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: false
  postgres:
    host: postgresdb
    port: 80
    database: wishlists_service
    sslMode: require
    credentialsSecret: wishlists-service-db-credentials
  userServiceUrl: http://user-api-svc
  userServiceTimeout: 2s
  internalTokensSecret:
    enabled: true
    name: internal-api-tokens
    key: INTERNAL_API_TOKENS
  redis:
    enabled: true
    addr: redis-svc:80
    db: '0'
    prefix: 'wishlists:'
    wishlistTtl: 5m
    userTtl: 10m
    popularTtl: 5m
  rateLimit:
    writesPerMinute: 120

  containerEnv:
    - name: HTTP_PORT
      value: '{{ .Values.wishlistsService.image.port }}'
    - name: LOG_LEVEL
      value: info
    - name: DB_HOST
      value: '{{ .Values.wishlistsService.postgres.host }}'
    - name: DB_PORT
      value: '{{ .Values.wishlistsService.postgres.port }}'
    - name: DB_NAME
      value: '{{ .Values.wishlistsService.postgres.database }}'
    - name: DB_SSLMODE
      value: '{{ .Values.wishlistsService.postgres.sslMode }}'
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.wishlistsService.postgres.credentialsSecret }}'
          key: POSTGRES_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.wishlistsService.postgres.credentialsSecret }}'
          key: POSTGRES_PASSWORD
    - name: USER_SERVICE_URL
      value: '{{ .Values.wishlistsService.userServiceUrl }}'
    - name: USER_SERVICE_TIMEOUT
      value: '{{ .Values.wishlistsService.userServiceTimeout }}'
    - name: RATE_LIMIT_WRITES_PER_MINUTE
      value: '{{ .Values.wishlistsService.rateLimit.writesPerMinute }}'
    - name: REDIS_ADDR
      value: '{{ .Values.wishlistsService.redis.addr }}'
      when: '{{ if .Values.wishlistsService.redis.enabled }}true{{ end }}'
    - name: REDIS_DB
      value: '{{ .Values.wishlistsService.redis.db }}'
      when: '{{ if .Values.wishlistsService.redis.enabled }}true{{ end }}'
    - name: REDIS_PREFIX
      value: '{{ .Values.wishlistsService.redis.prefix }}'
      when: '{{ if .Values.wishlistsService.redis.enabled }}true{{ end }}'
    - name: CACHE_WISHLIST_TTL
      value: '{{ .Values.wishlistsService.redis.wishlistTtl }}'
      when: '{{ if .Values.wishlistsService.redis.enabled }}true{{ end }}'
    - name: CACHE_USER_TTL
      value: '{{ .Values.wishlistsService.redis.userTtl }}'
      when: '{{ if .Values.wishlistsService.redis.enabled }}true{{ end }}'
    - name: CACHE_POPULAR_TTL
      value: '{{ .Values.wishlistsService.redis.popularTtl }}'
      when: '{{ if .Values.wishlistsService.redis.enabled }}true{{ end }}'
    - name: INTERNAL_API_TOKENS
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.wishlistsService.internalTokensSecret.name }}'
          key: '{{ .Values.wishlistsService.internalTokensSecret.key }}'
      when: '{{ if .Values.wishlistsService.internalTokensSecret.enabled }}true{{ end }}'
  # /health pings PostgreSQL (readiness); /livez only checks the process.
  probes:
    startup:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: false
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
