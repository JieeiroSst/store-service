{{- range .Values.mysql.serviceDatabases }}
{{- $secretName := printf "%s-db-credentials" .name }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
  {{- $password = index $existing.data "MYSQL_PASSWORD" | b64dec }}
{{- else }}
  {{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  MYSQL_USER: {{ .user | b64enc }}
  MYSQL_PASSWORD: {{ $password | b64enc }}
---
{{- end }}
