# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
ollamaModelPy:
  name: ollama-model-py
  selectorApp: ollama-model-py
  containerName: ollama-model-py
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/ollama-model-py
    tag: latest
    port: 11435
    pullPolicy: IfNotPresent

  service:
    name: ollama-model-py-svc
    type: ClusterIP
    port: 11435
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: ollama-model-py.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: false
  containerEnv:
    - name: PORT
      value: '{{ .Values.ollamaModelPy.image.port }}'
    - name: MODEL_NAME
      value: 'custom-model'
    - name: OLLAMA_BASE_URL
      value: 'http://ollama:11434'
    - name: OLLAMA_TARGET_MODEL
      value: 'bank-assistant'
    - name: OLLAMA_EMBED_MODEL
      value: 'nomic-embed-text'
    - name: POINTS_SERVICE_BASE_URL
      value: 'http://point-service-svc:3000'
  # No health endpoint known for this service: TCP checks on the http port.
  probes:
    startup:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: false
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
