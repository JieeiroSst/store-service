apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.livestreamService.node.name }}-srs-conf
data:
  srs.conf: |
    listen              {{ .Values.livestreamService.node.srs.rtmpPort }};
    max_connections     2000;
    daemon              off;
    srs_log_tank        console;

    http_server {
        enabled         on;
        listen          {{ .Values.livestreamService.node.srs.httpPort }};
        dir             ./objs/nginx/html;
    }

    vhost __defaultVhost__ {
        # Only on_publish/on_unpublish - no on_play/on_stop. Viewers never
        # connect to SRS directly in this architecture (they pull HLS from
        # a CDN/object storage), so those hooks would never fire for real
        # viewers; online-viewer counting instead comes from the player's
        # own heartbeat against the edge role's /viewers/heartbeat.
        http_hooks {
            enabled         on;
            on_publish      http://127.0.0.1:{{ .Values.livestreamService.image.httpPort }}/api/srs/on_publish;
            on_unpublish    http://127.0.0.1:{{ .Values.livestreamService.image.httpPort }}/api/srs/on_unpublish;
        }
    }
