{{- if .Values.livestreamService.node.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.livestreamService.node.name }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ .Values.livestreamService.node.name }}
  minReplicas: {{ .Values.livestreamService.node.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.livestreamService.node.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.livestreamService.node.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
