# Argo CD: namespace store-staging, auto-synced. Promoted from dev with the
# "Promote image" workflow; mirrors prod topology at smaller scale.
global:
  environment: staging

livestreamService:
  image:
    tag: latest
    pullPolicy: IfNotPresent

  node:
    # StatefulSet: scaled by node capacity (streams), not by HPA.
    replicas: 2
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    pdb:
      enabled: true
      maxUnavailable: 1
    topologySpread:
      enabled: true

  edge:
    # Browsers talk to the edge directly (rooms, viewer heartbeat, chat).
    ingress:
      enabled: true
      host: live-api.staging.store.example.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # Chat is a long-lived WebSocket.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      tls:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 65
    pdb:
      enabled: true
      maxUnavailable: 1
    topologySpread:
      enabled: true
