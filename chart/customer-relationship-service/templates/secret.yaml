{{- if not .Values.customerRelationshipService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.customerRelationshipService.name }}-secret
type: Opaque
stringData:
  # Dev default from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  mysqlPassword: {{ .Values.customerRelationshipService.env.mysqlPassword | quote }}
  apiKey: {{ .Values.customerRelationshipService.env.apiKey | quote }}
  minioAccessKey: {{ .Values.customerRelationshipService.env.minioAccessKey | quote }}
  minioSecretKey: {{ .Values.customerRelationshipService.env.minioSecretKey | quote }}
{{- end }}
