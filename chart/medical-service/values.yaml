medicalService:
  name: medical-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/medical-service
    tag: latest
    # Must match config.Server.PortHttpServer as resolved from env/Consul
    # (see medical-service/config/config.go).
    port: 8093

  service:
    name: medical-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: medical-service.local
    path: /
    pathType: Prefix

  # Plain env vars the container reads directly (see config.FromEnv) - works
  # standalone even before ops has seeded this service's config into the
  # cluster's shared Consul KV store. Override the password with a real secret
  # via --set or a values-prod.yaml.
  env:
    mysqlHost: mysql-svc
    mysqlPort: "80"
    mysqlUser: root
    mysqlPassword: password
    mysqlDbname: medical_service
    # Decides which calendar day counts as "today" for expiry checks.
    pharmacyTimezone: Asia/Ho_Chi_Minh

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
