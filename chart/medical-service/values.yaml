# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
medicalService:
  name: medical-service
  selectorApp: medical-service-deployment
  containerName: medical-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/medical-service
    tag: latest
    # Must match config.Server.PortHttpServer as resolved from env/Consul
    # (see medical-service/config/config.go).
    port: 8093
    pullPolicy: Always

  service:
    name: medical-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: medical-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # Plain env vars the container reads directly (see config.FromEnv) - works
  # standalone even before ops has seeded this service's config into the
  # cluster's shared Consul KV store. Override the password with a real secret
  # via --set or a values-prod.yaml.
  env:
    mysqlHost: mysql-svc
    mysqlPort: "80"
    mysqlUser: root
    mysqlPassword: password
    mysqlDbname: medical_service
    # Decides which calendar day counts as "today" for expiry checks.
    pharmacyTimezone: Asia/Ho_Chi_Minh

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT_HTTP_SERVER
      value: '{{ .Values.medicalService.image.port }}'
    - name: MYSQL_HOST
      value: '{{ .Values.medicalService.env.mysqlHost }}'
    - name: MYSQL_PORT
      value: '{{ .Values.medicalService.env.mysqlPort }}'
    - name: MYSQL_USER
      value: '{{ .Values.medicalService.env.mysqlUser }}'
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: medical-service-secret
          key: mysqlPassword
    - name: MYSQL_DBNAME
      value: '{{ .Values.medicalService.env.mysqlDbname }}'
    - name: PHARMACY_TIMEZONE
      value: '{{ .Values.medicalService.env.pharmacyTimezone }}'
  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 20

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
  envFile:
    enabled: true
    mountPath: /app/.env
    content: |
      HostConsul="http://consul-service"
      KeyConsul="medical_service"
      ServiceConsul="consul"
  # Seeds Consul KV `key` from files/consul.json when missing (chart/common).
  consulSeed:
    enabled: true
    key: medical_service
