# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
solanaService:
  name: solana-service
  selectorApp: solana-service
  containerName: solana-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/solana-service
    tag: latest
    port: 8080
    pullPolicy: IfNotPresent

  service:
    name: solana-service-svc
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: solana-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # Optional Secret with circleApiKey, circleEntityId. Never rendered from values: create it by
  # hand outside prod, and sync it with externalSecret in prod.
  secretRef:
    name: solana-service-secret

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: false
  containerEnv:
    - name: PORT
      value: '{{ .Values.solanaService.image.port }}'
    - name: SOLANA_RPC_URL
      value: 'https://api.devnet.solana.com'
    - name: CIRCLE_API_KEY
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.solanaService.secretRef.name }}'
          key: circleApiKey
          optional: true
    - name: CIRCLE_ENTITY_ID
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.solanaService.secretRef.name }}'
          key: circleEntityId
          optional: true
  # No health endpoint known for this service: TCP checks on the http port.
  probes:
    startup:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: false
    internet: true
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
