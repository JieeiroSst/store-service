apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.prometheus.name }}
  labels:
    app: {{ .Values.prometheus.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.prometheus.service.port }}
      protocol: TCP
      name: http
      targetPort: http
  selector:
    app: {{ .Values.prometheus.name }}
