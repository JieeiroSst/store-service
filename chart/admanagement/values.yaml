admanagement:
  name: admanagement
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/admanagement-service
    tag: latest
    port: 8000

  service:
    name: admanagement-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: admanagement.local
    path: /
    pathType: Prefix
