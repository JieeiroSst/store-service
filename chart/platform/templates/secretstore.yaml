{{- $ss := .Values.secretStore }}
{{- if $ss.enabled }}
{{- if eq $ss.provider "kubernetes" }}
{{- $src := $ss.kubernetes }}
# Non-prod: mirror Secrets that the umbrella chart's postgres provisioner
# created in another namespace, via a read-only service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ss.name }}-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $ss.name }}-reader-{{ .Release.Namespace }}
  namespace: {{ $src.remoteNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    {{- with $src.secretNames }}
    resourceNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $ss.name }}-reader-{{ .Release.Namespace }}
  namespace: {{ $src.remoteNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $ss.name }}-reader-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $ss.name }}-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $ss.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $src.remoteNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $ss.name }}-reader
{{- else }}
# Prod: a real secret manager. The provider block is passed through as-is
# (Vault, AWS Secrets Manager, GCP Secret Manager, ...).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $ss.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    {{- toYaml $ss.providerSpec | nindent 4 }}
{{- end }}
{{- end }}
