# Argo CD: namespace store-dev, auto-synced. CI bumps image.tag on every merge to master.
global:
  environment: dev
livestreamWeb:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  ingress:
    enabled: true
    host: live.dev.store.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    tls:
      enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 65
    # Laptop-sized: small requests so ~70 services fit one docker-desktop node;
    # limits from values.yaml still cap each pod.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
