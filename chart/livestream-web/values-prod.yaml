# Argo CD: namespace store-prod, MANUAL sync. Changes land here only through a
# reviewed PR opened by the "Promote image" workflow.
global:
  environment: prod
livestreamWeb:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  ingress:
    enabled: true
    host: live.store.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    tls:
      enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
  priorityClassName: store-standard
