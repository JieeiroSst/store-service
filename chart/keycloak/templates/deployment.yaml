apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: {{ .Values.keycloak.name | quote }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.keycloak.name | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.keycloak.name | quote }}
    spec:
        containers:
          - name: {{ .Values.keycloak.name | quote }}
            image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
            imagePullPolicy: "{{ .Values.keycloak.image.pullPolicy }}"
            env:
              -
                name: "KEYCLOAK_USER"
                value: {{ .Values.keycloak.admin.user | quote }}
              -
                name: "KEYCLOAK_PASSWORD"
                value: {{ .Values.keycloak.admin.password | quote }}
              -
                name: "PROXY_ADDRESS_FORWARDING"
                value: "true"
              -
                name: "KEYCLOAK_FRONTEND_URL"
                value: {{ .Values.keycloak.frontendUrl | quote }}
              -
                name: "KEYCLOAK_ADMIN_URL"
                value: {{ .Values.keycloak.adminUrl | quote }}
            ports:
              - name: "http"
                containerPort: 8080
              - name: "https"
                containerPort: 8443
            readinessProbe:
               httpGet:
                 path: "/auth/realms/master"
                 port: 8080
