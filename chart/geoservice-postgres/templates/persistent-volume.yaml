{{- /* Local clusters only: a hostPath volume bound to the claim below. Real
       clusters leave storage.hostPath empty and get a dynamically
       provisioned volume from storage.storageClass. */}}
{{- if .Values.geoservicePostgres.storage.hostPath }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.geoservicePostgres.name }}-persistent-volume
  labels:
    type: local
    app: {{ .Values.geoservicePostgres.name }}
spec:
  storageClassName: manual
  capacity:
    storage: {{ .Values.geoservicePostgres.storage.size }}
  accessModes:
    {{- toYaml .Values.geoservicePostgres.storage.accessModes | nindent 4 }}
  hostPath:
    path: {{ .Values.geoservicePostgres.storage.hostPath | quote }}
{{- end }}
