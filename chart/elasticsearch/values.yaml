elasticsearch:
  name: elasticsearch
  replicas: 1

  image:
    name: elasticsearch
    tag: "7.17.5"

  service:
    name: elasticsearch-service
    type: NodePort
    port: 9200
    nodePort: 31200

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  javaOpts: "-Xms384m -Xmx384m"
