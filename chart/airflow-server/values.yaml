airflowServer:
  name: airflow-server

  image:
    name: apache/airflow
    tag: 2.8.1-python3.11

  # LocalExecutor keeps this to a single-node deployment: no Celery/Redis broker needed.
  executor: LocalExecutor

  # Bootstrap admin user, created idempotently on webserver start.
  # This is also the account airflow-service authenticates as (config.AirflowConfig).
  auth:
    username: airflow
    password: airflow
    firstName: Admin
    lastName: Admin
    email: admin@example.com

  # Must be identical across webserver/scheduler pods. Leave blank only for local/dev use;
  # generate a real key (e.g. `python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`)
  # before running this anywhere shared.
  fernetKey: ""

  webserver:
    replicas: 1
    port: 8080
    service:
      name: airflow-webserver-svc
      type: LoadBalancer

  scheduler:
    replicas: 1

  # Dedicated metadata database for this Airflow instance.
  postgres:
    name: airflow-postgres
    db: airflow
    user: airflow
    password: airflow
    port: 5432
    image:
      name: postgres
      tag: "13"
    service:
      name: airflow-postgres-svc

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: airflow.local
    path: /
    pathType: Prefix
