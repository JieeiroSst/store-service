{{- $p := .Values.airflowServer.postgres.persistence }}
{{- if $p.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.airflowServer.postgres.name }}-data
  annotations:
    # Never let a sync or uninstall take the metadata database with it.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  {{- with $p.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
