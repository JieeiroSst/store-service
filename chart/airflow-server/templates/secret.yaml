{{- /* Credentials for every component. Prod syncs the same Secret from the
       secret manager instead (airflowServer.externalSecret). */}}
{{- $es := .Values.airflowServer.externalSecret }}
{{- if $es.enabled }}
{{- include "common.externalsecret" (dict "root" $ "svc" (dict "name" .Values.airflowServer.name "image" .Values.airflowServer.image "externalSecret" (merge (dict "targetName" (include "airflow-server.secretName" .)) $es))) }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "airflow-server.secretName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  sql-alchemy-conn: {{ include "airflow-server.sqlAlchemyConn" . | quote }}
  admin-password: {{ .Values.airflowServer.auth.password | quote }}
  postgres-password: {{ .Values.airflowServer.postgres.password | quote }}
  {{- with .Values.airflowServer.fernetKey }}
  fernet-key: {{ . | quote }}
  {{- end }}
{{- end }}
