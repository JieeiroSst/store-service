# Argo CD: namespace store-prod, MANUAL sync. Changes land here only through a
# reviewed PR opened by the "Promote image" workflow.
# Credentials come from the secret manager (SecretStore store-secrets);
# create the store/prod/... keys before the first sync.
global:
  environment: prod
userApi:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
  priorityClassName: store-critical
  envFile:
    externalSecret:
      remoteKey: store/prod/user-api/env-file
      property: env
  externalSecret:
    enabled: true
    targetName: user-service-config
    refreshInterval: 15m
    data:
      - secretKey: HostConsul
        remoteKey: store/prod/user-api
        property: HostConsul
      - secretKey: JwtSecretKey
        remoteKey: store/prod/user-api
        property: JwtSecretKey
      - secretKey: KeyConsul
        remoteKey: store/prod/user-api
        property: KeyConsul
      - secretKey: ServiceConsul
        remoteKey: store/prod/user-api
        property: ServiceConsul
userGrpc:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
  priorityClassName: store-critical
  envFile:
    externalSecret:
      remoteKey: store/prod/user-grpc/env-file
      property: env
