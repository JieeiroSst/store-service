userApi:
  name: user-api
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/user-service
    tag: latest
    port: 1235

  service:
    name: user-api-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: user-api.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

userGrpc:
  name: user-grpc
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/user-service
    tag: latest
    port: 1236

  service:
    name: user-grpc-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    host: user-grpc.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Consul + JWT settings user_service reads from its environment
# (github.com/JIeeiroSst/user-service/config.InitializeConfiguration),
# rendered into a Secret and injected via envFrom.
env:
  hostConsul: "http://consul-service"
  keyConsul: "user_service"
  serviceConsul: "consul"
  jwtSecretKey: "secretkey"
