userApi:
  name: user-api
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/user-service
    tag: latest
    port: 1235

  service:
    name: user-api-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: user-api.local
    path: /
    pathType: Prefix

userGrpc:
  name: user-grpc
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/user-service
    tag: latest
    port: 1236

  service:
    name: user-grpc-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    host: user-grpc.local
    path: /
    pathType: Prefix