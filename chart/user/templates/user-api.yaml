apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.userApi.name}}-deployment
spec:
  replicas: {{.Values.userApi.replicas}}
  selector:
    matchLabels:
      app: {{.Values.userApi.name}}-deployment
  template:
    metadata:
      labels:
        app: {{.Values.userApi.name}}-deployment
    spec:
      containers:
      - name: {{.Values.userApi.name}}-deployment
        image: {{.Values.userApi.image.name}}:{{.Values.userApi.image.tag}}
        imagePullPolicy: Always
        ports:
        - containerPort: {{.Values.userApi.image.port}}
        envFrom:
          - secretRef:
              name: user-service-config
        livenessProbe:
          tcpSocket:
            port: {{.Values.userApi.image.port}}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: {{.Values.userApi.image.port}}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.userApi.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.userApi.service.name}}
spec:
  ports:
  - port: 80
    targetPort: {{.Values.userApi.image.port}}
  selector:
    app: {{.Values.userApi.name}}-deployment
