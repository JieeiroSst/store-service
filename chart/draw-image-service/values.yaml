drawImageService:
  name: draw-image-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/draw-image-service
    tag: latest
    port: 8080

  service:
    name: draw-image-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
    host: draw-image-service.local
    path: /
    pathType: Prefix

  # Dev defaults - override passwords with --set or a values-prod.yaml.
  # The database is created by chart/mysql's provisioner (serviceDatabases)
  # and the bucket by chart/minio's bucket provisioner.
  env:
    mysqlHost: mysql-svc
    mysqlPort: "80"
    mysqlUser: root
    mysqlPassword: password
    mysqlDbname: draw_image_service

    minioEndpoint: minio-svc:9000
    minioAccessKey: minioadmin
    minioSecretKey: minioadmin123
    minioBucket: draw-image-service
    minioUseSsl: "false"

    maxUploadMb: "100"
    cellWidth: "100"
    cellHeight: "100"
    defaultColumns: "2"
    maxImages: "50"
    maxPixels: "50000000"
    jpegQuality: "95"
    # Canvas for layout=center
    centerWidth: "800"
    centerHeight: "800"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
