apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.drawImageService.name }}-deployment
  labels:
    app: {{ .Values.drawImageService.name }}
spec:
  {{- if not .Values.drawImageService.autoscaling.enabled }}
  replicas: {{ .Values.drawImageService.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.drawImageService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.drawImageService.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: {{ .Values.drawImageService.name }}
        image: "{{ .Values.drawImageService.image.name }}:{{ .Values.drawImageService.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.drawImageService.image.port }}
        env:
        - name: PORT_HTTP_SERVER
          value: {{ .Values.drawImageService.image.port | quote }}
        - name: MYSQL_HOST
          value: {{ .Values.drawImageService.env.mysqlHost | quote }}
        - name: MYSQL_PORT
          value: {{ .Values.drawImageService.env.mysqlPort | quote }}
        - name: MYSQL_USER
          value: {{ .Values.drawImageService.env.mysqlUser | quote }}
        - name: MYSQL_PASSWORD
          value: {{ .Values.drawImageService.env.mysqlPassword | quote }}
        - name: MYSQL_DBNAME
          value: {{ .Values.drawImageService.env.mysqlDbname | quote }}
        - name: MINIO_ENDPOINT
          value: {{ .Values.drawImageService.env.minioEndpoint | quote }}
        - name: MINIO_ACCESS_KEY
          value: {{ .Values.drawImageService.env.minioAccessKey | quote }}
        - name: MINIO_SECRET_KEY
          value: {{ .Values.drawImageService.env.minioSecretKey | quote }}
        - name: MINIO_BUCKET
          value: {{ .Values.drawImageService.env.minioBucket | quote }}
        - name: MINIO_USE_SSL
          value: {{ .Values.drawImageService.env.minioUseSsl | quote }}
        - name: MAX_UPLOAD_MB
          value: {{ .Values.drawImageService.env.maxUploadMb | quote }}
        - name: CELL_WIDTH
          value: {{ .Values.drawImageService.env.cellWidth | quote }}
        - name: CELL_HEIGHT
          value: {{ .Values.drawImageService.env.cellHeight | quote }}
        - name: DEFAULT_COLUMNS
          value: {{ .Values.drawImageService.env.defaultColumns | quote }}
        - name: MAX_IMAGES
          value: {{ .Values.drawImageService.env.maxImages | quote }}
        - name: MAX_PIXELS
          value: {{ .Values.drawImageService.env.maxPixels | quote }}
        - name: JPEG_QUALITY
          value: {{ .Values.drawImageService.env.jpegQuality | quote }}
        - name: CENTER_WIDTH
          value: {{ .Values.drawImageService.env.centerWidth | quote }}
        - name: CENTER_HEIGHT
          value: {{ .Values.drawImageService.env.centerHeight | quote }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.drawImageService.image.port }}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.drawImageService.image.port }}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          {{- toYaml .Values.drawImageService.resources | nindent 10 }}
