paymentWalletService:
  name: payment-wallet-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/payment-wallet-service
    tag: latest
    # Must match config.Server.PortHttpServer as resolved from env/Consul
    # (see payment-wallet-service/config/config.go and consul.json).
    port: 8088

  service:
    name: payment-wallet-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: payment-wallet-service.local
    path: /
    pathType: Prefix

  # Plain env vars the container reads directly (see config.FromEnv) -
  # works standalone even before ops has seeded this service's config into
  # the cluster's shared Consul KV store.
  env:
    postgresHost: postgresdb
    postgresPort: "80"
    postgresUser: testUser
    postgresPassword: testPassword
    postgresDbname: payment_wallet
    postgresSSLMode: "disable"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
