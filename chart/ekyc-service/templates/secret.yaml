{{- if not .Values.ekycService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ekycService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  postgresPassword: {{ .Values.ekycService.env.postgresPassword | quote }}
  s3AccessKey: {{ .Values.ekycService.env.s3AccessKey | quote }}
  s3SecretKey: {{ .Values.ekycService.env.s3SecretKey | quote }}
{{- end }}
