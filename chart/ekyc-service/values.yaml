# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
ekycService:
  name: ekyc-service
  selectorApp: ekyc-service-deployment
  containerName: ekyc-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/ekyc-service
    tag: latest
    # Must match config.Server.PortHttpServer (see ekyc-service/config/config.go).
    port: 8087
    pullPolicy: Always

  service:
    name: ekyc-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: ekyc-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # Plain env vars the container reads directly (config.FromEnv) - these
  # are a fallback/override alongside the Consul bootstrap vars mounted
  # from the shared service-env-files secret as /app/.env (see
  # chart/templates/env-files-secret.yaml's ekyc-service.env block and
  # templates/ekyc-service.yaml's volumeMount below).
  env:
    postgresHost: postgresdb
    postgresPort: "80"
    postgresUser: testUser
    postgresPassword: testPassword
    postgresDbname: ekyc
    postgresSSLMode: "disable"
    userServiceBaseURL: http://user-api-svc
    userServiceTimeout: 5s
    # MinIO/S3 static-file storage (card photos, chip portraits, face-scan
    # crops) - see internal/adapter/secondary/storage and chart/minio.
    s3Endpoint: minio-svc:9000
    s3Bucket: ekyc-service
    s3AccessKey: minioadmin
    s3SecretKey: minioadmin123
    s3UseSSL: "false"
    # Thresholds for the in-house MRZ/face algorithms - see
    # ekyc-service/internal/adapter/secondary/{cardreader,facebio} and
    # config.EkycConfig.
    mrzMinConfidence: "0.85"
    faceMatchThreshold: "0.6"
    faceMinQuality: "15.0"
    # "native" (in-house Go algorithms) or "python" (heavier dlib/EasyOCR
    # subprocess adapter - see internal/adapter/secondary/pyextract). The
    # python provider needs the python image variant; see Dockerfile.
    cardReaderProvider: native
    faceAnalyzerProvider: native

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT_HTTP_SERVER
      value: '{{ .Values.ekycService.image.port }}'
    - name: POSTGRES_HOST
      value: '{{ .Values.ekycService.env.postgresHost }}'
    - name: POSTGRES_PORT
      value: '{{ .Values.ekycService.env.postgresPort }}'
    - name: POSTGRES_USER
      value: '{{ .Values.ekycService.env.postgresUser }}'
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ekyc-service-secret
          key: postgresPassword
    - name: POSTGRES_DBNAME
      value: '{{ .Values.ekycService.env.postgresDbname }}'
    - name: POSTGRES_SSLMODE
      value: '{{ .Values.ekycService.env.postgresSSLMode }}'
    - name: USER_SERVICE_BASE_URL
      value: '{{ .Values.ekycService.env.userServiceBaseURL }}'
    - name: USER_SERVICE_TIMEOUT
      value: '{{ .Values.ekycService.env.userServiceTimeout }}'
    - name: EKYC_MRZ_MIN_CONFIDENCE
      value: '{{ .Values.ekycService.env.mrzMinConfidence }}'
    - name: EKYC_FACE_MATCH_THRESHOLD
      value: '{{ .Values.ekycService.env.faceMatchThreshold }}'
    - name: EKYC_FACE_MIN_QUALITY
      value: '{{ .Values.ekycService.env.faceMinQuality }}'
    - name: S3_ENDPOINT
      value: '{{ .Values.ekycService.env.s3Endpoint }}'
    - name: S3_BUCKET
      value: '{{ .Values.ekycService.env.s3Bucket }}'
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: ekyc-service-secret
          key: s3AccessKey
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ekyc-service-secret
          key: s3SecretKey
    - name: S3_USE_SSL
      value: '{{ .Values.ekycService.env.s3UseSSL }}'
    - name: CARD_READER_PROVIDER
      value: '{{ .Values.ekycService.env.cardReaderProvider }}'
    - name: FACE_ANALYZER_PROVIDER
      value: '{{ .Values.ekycService.env.faceAnalyzerProvider }}'
  envFile:
    enabled: true
    mountPath: /app/.env
    content: |
      HostConsul="http://consul-service"
      KeyConsul="ekyc_service"
      ServiceConsul="consul"
      POSTGRES_HOST=postgresdb
      POSTGRES_PORT=80
      POSTGRES_USER=testUser
      POSTGRES_PASSWORD=testPassword
      POSTGRES_DBNAME=ekyc
      POSTGRES_SSLMODE=disable
      S3_ENDPOINT=minio-svc:9000
      S3_BUCKET=ekyc-service
      S3_ACCESS_KEY=minioadmin
      S3_SECRET_KEY=minioadmin123
      S3_USE_SSL=false
      USER_SERVICE_BASE_URL=http://user-api-svc
      CARD_READER_PROVIDER=native
      FACE_ANALYZER_PROVIDER=native
  # No health endpoint known for this service: TCP checks on the http port.
  # Swap for httpGet once the service exposes /health.
  probes:
    startup:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
  # Seeds Consul KV `key` from files/consul.json when missing (chart/common).
  consulSeed:
    enabled: true
    key: ekyc_service
