airflow:
  name: airflow-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/airflow-service
    tag: latest
    port: 8000

  service:
    name: airflow-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: airflow-service.local
    path: /
    pathType: Prefix
