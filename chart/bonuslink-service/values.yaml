# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
bonuslinkService:
  name: bonuslink-service
  selectorApp: bonuslink-service-deployment
  containerName: bonuslink-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/bonuslink-service
    tag: latest
    # Must match APP_PORT (see bonuslink-service/internal/config/config.go).
    port: 8080
    pullPolicy: Always

  service:
    name: bonuslink-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: bonuslink-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # The service reads plain environment variables. Dev defaults - override the
  # secrets with --set or a values-prod.yaml before deploying anywhere real.
  env:
    appEnv: production
    logLevel: info

    # Points at the umbrella chart's postgres (admin credentials from chart/postgres).
    postgresHost: postgresdb
    postgresPort: "80"
    postgresDatabase: bonuslink_service
    postgresUser: testUser
    postgresPassword: testPassword
    postgresSSLMode: disable

    # referral-service publishes reward events to this exchange; the queue is
    # bound with the routing key below.
    rabbitmqHost: rabbitmq-service
    rabbitmqPort: "5672"
    rabbitmqUser: admin
    rabbitmqPassword: admin
    rabbitmqExchange: referral.events
    rabbitmqQueue: bonuslink.reward
    rabbitmqRoutingKey: referral.reward.granted

  # Before the server starts: create the database if missing, then apply
  # migrations/ with golang-migrate (which locks, so replicas starting together
  # cannot apply them twice).
  migrations:
    enabled: true
    postgresClientImage: postgres:16

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  initContainersTemplate: bonuslink-service.initContainers
  containerEnv:
    - name: APP_ENV
      value: '{{ .Values.bonuslinkService.env.appEnv }}'
    - name: APP_PORT
      value: '{{ .Values.bonuslinkService.image.port }}'
    - name: LOG_LEVEL
      value: '{{ .Values.bonuslinkService.env.logLevel }}'
    - name: POSTGRES_HOST
      value: '{{ .Values.bonuslinkService.env.postgresHost }}'
    - name: POSTGRES_PORT
      value: '{{ .Values.bonuslinkService.env.postgresPort }}'
    - name: POSTGRES_DATABASE
      value: '{{ .Values.bonuslinkService.env.postgresDatabase }}'
    - name: POSTGRES_SSLMODE
      value: '{{ .Values.bonuslinkService.env.postgresSSLMode }}'
    - name: COM_POSTGRES_USERNAME
      value: '{{ .Values.bonuslinkService.env.postgresUser }}'
    - name: COM_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: bonuslink-service-secret
          key: postgresPassword
    - name: RABBITMQ_HOST
      value: '{{ .Values.bonuslinkService.env.rabbitmqHost }}'
    - name: RABBITMQ_PORT
      value: '{{ .Values.bonuslinkService.env.rabbitmqPort }}'
    - name: RABBITMQ_EXCHANGE
      value: '{{ .Values.bonuslinkService.env.rabbitmqExchange }}'
    - name: RABBITMQ_QUEUE
      value: '{{ .Values.bonuslinkService.env.rabbitmqQueue }}'
    - name: RABBITMQ_ROUTING_KEY
      value: '{{ .Values.bonuslinkService.env.rabbitmqRoutingKey }}'
    - name: COM_RABBITMQ_USERNAME
      value: '{{ .Values.bonuslinkService.env.rabbitmqUser }}'
    - name: COM_RABBITMQ_PASSWORD
      valueFrom:
        secretKeyRef:
          name: bonuslink-service-secret
          key: rabbitmqPassword
  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
