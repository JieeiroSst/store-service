toggleService:
  name: toggle-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/toggle-service
    tag: latest
    # Must match config.Server.Port as resolved from Consul, or the
    # HTTP_PORT env var fallback (see internal/infrastructure/config).
    httpPort: 8080

  service:
    name: toggle-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: toggle-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
