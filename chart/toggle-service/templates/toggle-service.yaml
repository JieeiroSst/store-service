apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.toggleService.name }}-deployment
spec:
{{- if not .Values.toggleService.autoscaling.enabled }}
  replicas: {{ .Values.toggleService.replicas }}
{{- end }}
  selector:
    matchLabels:
      app: {{ .Values.toggleService.name }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.toggleService.name }}-deployment
    spec:
      containers:
      - name: {{ .Values.toggleService.name }}-deployment
        image: {{ .Values.toggleService.image.name }}:{{ .Values.toggleService.image.tag }}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: {{ .Values.toggleService.image.httpPort }}
        env:
          - name: HTTP_PORT
            value: "{{ .Values.toggleService.image.httpPort }}"
        resources:
          {{- toYaml .Values.toggleService.resources | nindent 10 }}
        volumeMounts:
        - name: env-file
          mountPath: /app/.env
          subPath: toggle-service.env
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.toggleService.image.httpPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.toggleService.image.httpPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: env-file
        secret:
          secretName: service-env-files
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.toggleService.service.name }}
spec:
  type: {{ .Values.toggleService.service.type }}
  ports:
  - port: 80
    targetPort: {{ .Values.toggleService.image.httpPort }}
  selector:
    app: {{ .Values.toggleService.name }}-deployment
