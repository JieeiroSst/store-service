postgres:
  name: postgresdb
  replicas: 1

  image:
    repository: postgres
    tag: "16"

  walLevel: logical

  credentials:
    database: testDB
    user: testUser
    password: testPassword

  service:
    port: 80
    targetPort: 5432
    nodePort: 31000

  storage:
    size: 8Gi
    hostPath: /data/db

  # Per-service databases + dedicated roles provisioned on install/upgrade
  # (in addition to credentials.database, which the postgres image creates
  # automatically). Each entry gets its own DB, its own login role (never
  # the shared admin user above), and has its Consul KV config patched with
  # the generated user/password so the service actually picks it up.
  # Add an entry here to onboard a new service.
  serviceDatabases:
    - name: admanagement
      database: admanagement
      role: admanagement_svc
      consulKey: admanagement_service
      userField: .postgres.user
      passwordField: .postgres.password
    - name: authorize-service
      database: authorize
      role: authorize_svc
      consulKey: authorize_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: automatic-payment-service
      database: automatic_payment
      role: automatic_payment_svc
      consulKey: automatic_payment_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: book-store-service
      database: book_store
      role: book_store_svc
      consulKey: book-store-service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: billing-service
      database: billing
      role: billing_svc
      consulKey: billing_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: bot-service
      database: bot_service
      role: bot_service_svc
      consulKey: bot_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: account-transaction
      database: account_transaction
      role: account_transaction_svc
      consulKey: account_transaction_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: user
      database: user
      role: user_svc
      consulKey: user_service
      userField: .postgres.PostgresqlUser
      passwordField: .postgres.PostgresqlPassword
    - name: livestream-service
      database: livestream
      role: livestream_svc
      consulKey: livestream_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: cdn-service
      database: cdn_service
      role: cdn_service_svc
      consulKey: cdn_service
      userField: .postgres.postgresql_user
      passwordField: .postgres.postgresql_password
    - name: shortlink-service
      database: shortlink
      role: shortlink_svc
      consulKey: shortlink_service
      userField: .postgres.postgresqlUser
      passwordField: .postgres.postgresqlPassword
    - name: photo-service
      database: photo_service
      role: photo_service_svc
      consulKey: photo_service
      userField: .postgres.user
      passwordField: .postgres.password
    # vending-machine-service reads plain env vars, not Consul: the entry
    # creates its database and the vending-machine-service-db-credentials
    # Secret its deployment reads (the Consul patch is skipped when the key is absent).
    - name: vending-machine-service
      database: vending_machine
      role: vending_machine_svc
      consulKey: vending_machine_service
      userField: .postgres.user
      passwordField: .postgres.password
    # voucher-service also reads plain env vars (CONSUL_ENABLED=false); its
    # chart takes POSTGRES_USER/PASSWORD from voucher-service-db-credentials.
    - name: voucher-service
      database: voucher
      role: voucher_svc
      consulKey: voucher_service
      userField: .postgres.user
      passwordField: .postgres.password
    # book-service reads plain env vars (DB_URL / DB_USERNAME / DB_PASSWORD);
    # its chart takes the credentials from book-service-db-credentials.
    - name: book-service
      database: book_service
      role: book_service_svc
      consulKey: book_service
      userField: .postgres.user
      passwordField: .postgres.password
    # sard-card-service reads the role from Consul (card_service) and, taking
    # precedence, from sard-card-service-db-credentials.
    - name: sard-card-service
      database: card
      role: card_svc
      consulKey: card_service
      userField: .postgres.user
      passwordField: .postgres.password
    - name: sard-customer-info-service
      database: customer_info
      role: customer_info_svc
      consulKey: customer_info_service
      userField: .postgres.user
      passwordField: .postgres.password
    - name: sard-auth-service
      database: payment_auth
      role: payment_auth_svc
      consulKey: auth_service
      userField: .postgres.user
      passwordField: .postgres.password
