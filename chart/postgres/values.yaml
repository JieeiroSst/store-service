postgres:
  name: postgresdb
  replicas: 1

  image:
    repository: postgres
    tag: "16"

  walLevel: logical

  credentials:
    database: testDB
    user: testUser
    password: testPassword

  service:
    port: 80
    targetPort: 5432
    nodePort: 31000

  storage:
    size: 8Gi
    hostPath: /data/db

  # Extra per-service databases provisioned on install/upgrade, in addition
  # to credentials.database which the postgres image creates automatically.
  initDatabases:
    - admanagement
    - book_store
    - authorize
    - automatic_payment
    - billing
    - bot_service
    - account_transaction
    - user
