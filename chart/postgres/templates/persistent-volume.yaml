apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.postgres.name }}-persistent-volume
  labels:
    type: local
    app: {{ .Values.postgres.name }}
spec:
  storageClassName: manual
  capacity:
    storage: {{ .Values.postgres.storage.size }}
  accessModes:
    - ReadWriteMany
  hostPath:
    path: {{ .Values.postgres.storage.hostPath | quote }}
