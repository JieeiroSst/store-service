apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}-nodeport
  labels:
    app: {{ .Values.postgres.name }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.postgres.service.targetPort }}
      targetPort: {{ .Values.postgres.service.targetPort }}
      nodePort: {{ .Values.postgres.service.nodePort }}
  selector:
    app: {{ .Values.postgres.name }}
