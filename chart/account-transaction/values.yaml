accountTransaction:
  name: account-transaction
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/account-transaction-service
    tag: latest
    # Must match config.Server.PortHttpServer / PortGrpcServer as resolved
    # from Consul at startup (see account-transaction-service/config/config.go).
    httpPort: 8081
    grpcPort: 9091

  service:
    httpName: account-transaction-api-svc
    grpcName: account-transaction-grpc-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    http:
      host: account-transaction.local
      path: /
      pathType: Prefix
    grpc:
      enabled: false
      host: account-transaction-grpc.local
      path: /
      pathType: Prefix
      annotations: {}
