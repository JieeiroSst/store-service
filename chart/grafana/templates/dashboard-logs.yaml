apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboard-logs
    labels:
      app: {{.Values.grafana.name}}-deployment
data:
    logs-search.json: |-
      {
        "uid": "service-logs-search",
        "title": "Service Logs Search",
        "tags": ["logs", "loki"],
        "timezone": "browser",
        "schemaVersion": 37,
        "version": 1,
        "refresh": "10s",
        "time": { "from": "now-1h", "to": "now" },
        "templating": {
          "list": [
            {
              "name": "service",
              "label": "Service",
              "type": "query",
              "datasource": { "type": "loki", "uid": "loki" },
              "query": "label_values(app)",
              "refresh": 2,
              "sort": 1,
              "multi": true,
              "includeAll": true,
              "allValue": ".+",
              "current": { "text": "All", "value": "$__all" }
            },
            {
              "name": "level",
              "label": "Level",
              "type": "query",
              "datasource": { "type": "loki", "uid": "loki" },
              "query": "label_values(level)",
              "refresh": 2,
              "sort": 1,
              "multi": true,
              "includeAll": true,
              "allValue": ".*",
              "current": { "text": "All", "value": "$__all" }
            },
            {
              "name": "search",
              "label": "Search text",
              "type": "textbox",
              "query": "",
              "current": { "text": "", "value": "" }
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "Log volume by service",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 7, "w": 24, "x": 0, "y": 0 },
            "fieldConfig": {
              "defaults": { "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } } },
              "overrides": []
            },
            "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "loki", "uid": "loki" },
                "expr": "sum by (app) (count_over_time({app=~\"$service\", level=~\"$level\"} |= `$search` [$__interval]))",
                "queryType": "range",
                "legendFormat": {{ `"{{app}}"` }}
              }
            ]
          },
          {
            "id": 2,
            "type": "logs",
            "title": "Log stream",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 18, "w": 24, "x": 0, "y": 7 },
            "options": {
              "showTime": true,
              "showLabels": true,
              "showCommonLabels": false,
              "wrapLogMessage": true,
              "prettifyLogMessage": true,
              "enableLogDetails": true,
              "dedupStrategy": "none",
              "sortOrder": "Descending"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "loki", "uid": "loki" },
                "expr": "{app=~\"$service\", level=~\"$level\"} |= `$search`",
                "queryType": "range"
              }
            ]
          }
        ]
      }
