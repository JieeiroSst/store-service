apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboard-provider
    labels:
      app: {{.Values.grafana.name}}-deployment
data:
    dashboards.yaml: |-
      apiVersion: 1
      providers:
      - name: default
        orgId: 1
        folder: "Logs"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
