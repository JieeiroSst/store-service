apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboard-service-detail
    labels:
      app: {{.Values.grafana.name}}-deployment
data:
    service-detail.json: |-
      {
        "uid": "service-detail",
        "title": "Service Detail",
        "tags": ["metrics", "logs", "service"],
        "timezone": "browser",
        "schemaVersion": 37,
        "version": 1,
        "refresh": "30s",
        "time": { "from": "now-1h", "to": "now" },
        "templating": {
          "list": [
            {
              "name": "service",
              "label": "Service",
              "type": "query",
              "datasource": { "type": "loki", "uid": "loki" },
              "query": "label_values(app)",
              "refresh": 2,
              "sort": 1,
              "multi": false,
              "includeAll": false,
              "current": { "text": "notification-service-deployment", "value": "notification-service-deployment" }
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "stat",
            "title": "CPU usage (cores)",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
            "fieldConfig": { "defaults": { "unit": "short", "decimals": 3 }, "overrides": [] },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"$service.*\"}[$__rate_interval]))",
                "instant": true
              }
            ]
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Memory usage",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
            "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(container_memory_working_set_bytes{pod=~\"$service.*\"})",
                "instant": true
              }
            ]
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Error log lines (1h)",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
            "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "red", "value": 1 }
            ] } }, "overrides": [] },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "loki", "uid": "loki" },
                "expr": "sum(count_over_time({app=\"$service\"} |~ `(?i)error` [$__range]))",
                "instant": true
              }
            ]
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Running pods",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "count(count by (pod) (container_memory_working_set_bytes{pod=~\"$service.*\"}))",
                "instant": true
              }
            ]
          },
          {
            "id": 5,
            "type": "timeseries",
            "title": "CPU usage over time",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
            "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10 } }, "overrides": [] },
            "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{pod=~\"$service.*\"}[$__rate_interval]))",
                "legendFormat": {{ `"{{pod}}"` }}
              }
            ]
          },
          {
            "id": 6,
            "type": "timeseries",
            "title": "Memory usage over time",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
            "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "drawStyle": "line", "fillOpacity": 10 } }, "overrides": [] },
            "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (pod) (container_memory_working_set_bytes{pod=~\"$service.*\"})",
                "legendFormat": {{ `"{{pod}}"` }}
              }
            ]
          },
          {
            "id": 7,
            "type": "timeseries",
            "title": "Network I/O (receive / transmit)",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
            "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "drawStyle": "line", "fillOpacity": 10 } }, "overrides": [] },
            "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (pod) (rate(container_network_receive_bytes_total{pod=~\"$service.*\"}[$__rate_interval]))",
                "legendFormat": {{ `"rx {{pod}}"` }}
              },
              {
                "refId": "B",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{pod=~\"$service.*\"}[$__rate_interval])) * -1",
                "legendFormat": {{ `"tx {{pod}}"` }}
              }
            ]
          },
          {
            "id": 8,
            "type": "logs",
            "title": "Log stream",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 14, "w": 24, "x": 0, "y": 20 },
            "options": {
              "showTime": true,
              "showLabels": false,
              "showCommonLabels": false,
              "wrapLogMessage": true,
              "prettifyLogMessage": true,
              "enableLogDetails": true,
              "dedupStrategy": "none",
              "sortOrder": "Descending"
            },
            "targets": [
              {
                "refId": "A",
                "datasource": { "type": "loki", "uid": "loki" },
                "expr": "{app=\"$service\"}",
                "queryType": "range"
              }
            ]
          }
        ]
      }
