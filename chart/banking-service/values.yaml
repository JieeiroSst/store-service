bankingService:
  name: banking-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/banking-service
    tag: latest
    # Must match config.Server.ServerPort as resolved from Consul, or the
    # PORT env var fallback (see banking-service/config/config.go).
    port: 3000

  service:
    name: banking-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: banking-service.local
    path: /
    pathType: Prefix
