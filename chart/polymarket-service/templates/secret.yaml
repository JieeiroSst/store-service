{{- if not .Values.polymarketService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.polymarketService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  mysqlPassword: {{ .Values.polymarketService.env.mysqlPassword | quote }}
  adminToken: {{ .Values.polymarketService.env.adminToken | quote }}
  redisPassword: {{ .Values.polymarketService.env.redisPassword | quote }}
{{- end }}
