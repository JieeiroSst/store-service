deliveryService:
  name: delivery-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/delivery-service
    tag: latest
    # Must match config.Server.PortServer as resolved from Consul (see
    # restaurant/delivery-service/config/config.go and consul.json).
    port: 1137

  service:
    name: delivery-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: delivery-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
