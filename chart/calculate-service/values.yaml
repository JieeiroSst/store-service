calculate:
  name: calculate-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/calculate-service
    tag: latest
    port: 1239

  service:
    name: calculate-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: calculate-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
