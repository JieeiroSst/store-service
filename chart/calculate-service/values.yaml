calculate:
  name: calculate-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/calculate-service
    tag: latest
    port: 1239

  service:
    name: calculate-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: calculate-service.local
    path: /
    pathType: Prefix
