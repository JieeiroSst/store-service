# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
foodService:
  name: food-service
  selectorApp: food-service
  containerName: food-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/food-service
    tag: latest
    port: 8080
    pullPolicy: IfNotPresent

  service:
    name: food-service-svc
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: food-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 768Mi

  autoscaling:
    enabled: false
  containerEnv:
    - name: SERVER_PORT
      value: '{{ .Values.foodService.image.port }}'
    - name: SPRING_DATASOURCE_URL
      value: 'jdbc:mysql://mysql-svc:80/food_service?createDatabaseIfNotExist=true'
    - name: SPRING_DATASOURCE_USERNAME
      value: 'root'
    - name: SPRING_DATASOURCE_PASSWORD
      value: 'password'
    - name: REDIS_HOST
      value: 'redis-svc'
    - name: REDIS_PORT
      value: '80'
    - name: REDIS_USER
      value: 'default'
    - name: REDIS_PASSWORD
      value: ''
    - name: SPRING_RABBITMQ_HOST
      value: 'rabbitmq-service'
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:MaxRAMPercentage=75'
  # No health endpoint known for this service: TCP checks on the http port.
  probes:
    startup:
      tcpSocket:
        port: http
      periodSeconds: 5
      failureThreshold: 60
    readiness:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      tcpSocket:
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: false
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
