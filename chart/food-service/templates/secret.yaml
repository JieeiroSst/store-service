{{- if not .Values.foodService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.foodService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml; values-prod.yaml switches to an ExternalSecret.
  datasourcePassword: {{ .Values.foodService.env.datasourcePassword | quote }}
  redisPassword: {{ .Values.foodService.env.redisPassword | quote }}
{{- end }}
