apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.partnerService.name }}-deployment
spec:
{{- if not .Values.partnerService.autoscaling.enabled }}
  replicas: {{ .Values.partnerService.replicas }}
{{- end }}
  selector:
    matchLabels:
      app: {{ .Values.partnerService.name }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.partnerService.name }}-deployment
    spec:
      containers:
      - name: {{ .Values.partnerService.name }}-deployment
        image: {{ .Values.partnerService.image.name }}:{{ .Values.partnerService.image.tag }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.partnerService.image.port }}
        resources:
          {{- toYaml .Values.partnerService.resources | nindent 10 }}
        volumeMounts:
        - name: env-file
          mountPath: /app/.env
          subPath: partner-service.env
      volumes:
      - name: env-file
        secret:
          secretName: service-env-files
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.partnerService.service.name }}
spec:
  type: {{ .Values.partnerService.service.type }}
  ports:
  - port: 80
    targetPort: {{ .Values.partnerService.image.port }}
  selector:
    app: {{ .Values.partnerService.name }}-deployment
