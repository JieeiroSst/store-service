partnerService:
  name: partner-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/partner-service
    tag: latest
    # Must match config.Server.ServerPort as resolved from Consul at
    # startup (see partner-service/internal/config/config.go and the
    # partner_service key seeded into Consul KV).
    port: 8088

  service:
    name: partner-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: partner-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
