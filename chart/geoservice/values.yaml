geoservice:
  name: geoservice
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/geoservice
    tag: latest
    # Must match config.ServerConfig.Port as resolved from Consul KV (see
    # geoservice/config/config.go and files/consul.json below).
    port: 8081

  service:
    name: geoservice-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: geoservice.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
