# Reference copy of geoservice/consul.json, embedded so the seed Job below
# (consul-seed-job.yaml) can PUT it into Consul KV without reaching outside
# this chart's own file tree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: geoservice-consul-seed
data:
  geoservice.json: |-
{{ .Files.Get "files/consul.json" | indent 4 }}
