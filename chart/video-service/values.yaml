# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
videoService:
  name: video-service
  selectorApp: video-service-deployment
  containerName: video-service-deployment
  replicas: 2

  image:
    name: ghcr.io/jieeirosst/video-service
    tag: latest
    # Must match PORT_HTTP_SERVER (see video-service/BE/config/config.go).
    port: 8080
    pullPolicy: Always

  service:
    name: video-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    # Videos are large: let uploads stream through to the pod instead of being
    # buffered by nginx, and don't buffer the (Range) responses either.
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "2g"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Shares the host with chart/video-web, which serves "/".
    host: video-service.local
    path: /api
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # Env the container reads directly (see video-service/BE/config/config.go).
  # MinIO defaults match chart/minio; override the credentials with --set or a
  # values-prod.yaml before deploying anywhere real. Add the bucket to
  # minio.buckets in chart/minio/values.yaml (it is also created on startup).
  env:
    minioEndpoint: minio-svc:9000
    minioAccessKey: minioadmin
    minioSecretKey: minioadmin123
    minioBucket: video-service
    minioUseSSL: "false"
    redisAddr: redis-svc:80
    allowedOrigins: "*"
    maxUploadMB: "2048"

    # Read buffer: chunks of this size are fetched from MinIO once and served
    # to every viewer from memory. cacheSizeMB must stay well under the
    # memory limit below (Go heap + cache + in-flight responses).
    chunkSizeKB: "1024"
    cacheSizeMB: "512"
    prefetchChunks: "2"
    # Metadata changes are pushed to every replica over Redis pub/sub; these
    # TTLs are only a safety net if a message is missed.
    metaTTLSeconds: "300"
    listTTLSeconds: "30"

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1280Mi

  # Streaming is CPU/network bound and the pods are stateless, so scale wide.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 30
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT_HTTP_SERVER
      value: '{{ .Values.videoService.image.port }}'
    - name: MINIO_ENDPOINT
      value: '{{ .Values.videoService.env.minioEndpoint }}'
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: video-service-secret
          key: minioAccessKey
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: video-service-secret
          key: minioSecretKey
    - name: MINIO_BUCKET
      value: '{{ .Values.videoService.env.minioBucket }}'
    - name: MINIO_USE_SSL
      value: '{{ .Values.videoService.env.minioUseSSL }}'
    - name: REDIS_ADDR
      value: '{{ .Values.videoService.env.redisAddr }}'
    - name: ALLOWED_ORIGINS
      value: '{{ .Values.videoService.env.allowedOrigins }}'
    - name: MAX_UPLOAD_MB
      value: '{{ .Values.videoService.env.maxUploadMB }}'
    - name: CHUNK_SIZE_KB
      value: '{{ .Values.videoService.env.chunkSizeKB }}'
    - name: CACHE_SIZE_MB
      value: '{{ .Values.videoService.env.cacheSizeMB }}'
    - name: PREFETCH_CHUNKS
      value: '{{ .Values.videoService.env.prefetchChunks }}'
    - name: META_TTL_SECONDS
      value: '{{ .Values.videoService.env.metaTTLSeconds }}'
    - name: LIST_TTL_SECONDS
      value: '{{ .Values.videoService.env.listTTLSeconds }}'
    - name: GOMEMLIMIT
      value: '{{ .Values.videoService.resources.limits.memory | replace "Mi" "MiB" | replace "Gi" "GiB" }}'
  probes:
    readiness:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 5
    liveness:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
  lifecycle:
    preStop:
      exec:
        command:
          - sh
          - -c
          - sleep 5

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 0
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []

# Transcoding workers (same image, ROLE=worker): turn each upload into an HLS
# ladder (1080p/720p/480p/360p, capped at the source height) and a thumbnail.
# They pull jobs from a Redis stream, so add replicas to process uploads in
# parallel; a job whose worker dies is picked up by another after
# claimIdleMinutes. Kept off the API pods so ffmpeg can't starve viewers.
videoWorker:
  name: video-worker
  # Image (name/tag/pullPolicy) is taken from videoService.image in
  # templates/app.yaml, so API and worker always ship the same build.
  selectorApp: video-worker-deployment
  containerName: video-worker-deployment
  replicas: 2
  concurrency: "1"          # videos per worker at once; ffmpeg already uses all cores
  jobTimeoutMinutes: "60"

  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi

  # Scratch space for the downloaded original + rendered segments.
  scratchSize: 20Gi
  containerEnv:
    - name: ROLE
      value: worker
    - name: MINIO_ENDPOINT
      value: '{{ .Values.videoService.env.minioEndpoint }}'
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.videoService.name }}-secret'
          key: minioAccessKey
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.videoService.name }}-secret'
          key: minioSecretKey
    - name: MINIO_BUCKET
      value: '{{ .Values.videoService.env.minioBucket }}'
    - name: MINIO_USE_SSL
      value: '{{ .Values.videoService.env.minioUseSSL }}'
    - name: REDIS_ADDR
      value: '{{ .Values.videoService.env.redisAddr }}'
    - name: WORKER_CONCURRENCY
      value: '{{ .Values.videoWorker.concurrency }}'
    - name: TRANSCODE_TIMEOUT_MINUTES
      value: '{{ .Values.videoWorker.jobTimeoutMinutes }}'
  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: '{{ .Values.videoWorker.scratchSize }}'
  volumeMounts:
    - name: scratch
      mountPath: /tmp

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 60 # transcodes are long; an interrupted job is retried elsewhere
  preStopSleepSeconds: 0
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: false
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
  probes: {}
