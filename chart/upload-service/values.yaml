uploadService:
  name: upload-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/upload-service
    tag: latest
    # Must match PORT (see upload_service/config/config.go).
    port: 8080

  service:
    name: upload-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: upload-service.local
    path: /
    pathType: Prefix

  # The service reads plain environment variables. Dev defaults - override the
  # secrets with --set or a values-prod.yaml before deploying anywhere real.
  env:
    # File metadata.
    mongoURI: mongodb://mongo-svc:80
    mongoDatabase: upload

    # File bytes live in a private bucket of the shared MinIO (chart/minio),
    # created on startup, and are only served through this service.
    minioEndpoint: minio-svc:9000
    minioBucket: upload-service
    minioUseSSL: false
    minioAccessKey: minioadmin
    minioSecretKey: minioadmin123

    # Every route needs a user-service bearer token. With authMode "token" the
    # service refuses to start without userServiceBaseURL.
    authMode: token
    userServiceBaseURL: http://user-api-svc
    authCacheTTL: 5s

    # Other services of the cluster (ticket-service keeps invoices and tickets here) call with this key instead of a user's
    # token (X-Service-Key). Files of the receivers under serviceOnlyReceiverPrefixes can only be reached with it: a user's
    # token cannot list or read them, so the owning service decides who sees what. Both are dev defaults - override the key.
    # Empty prefixes leave every receiver reachable with any valid token.
    serviceApiKey: dev-upload-service-key
    serviceOnlyReceiverPrefixes: "ticket-user:"

    # The type is detected from the file's bytes, not its name.
    maxUploadMB: "20"
    allowedTypes: application/pdf,image/jpeg,image/png,image/webp,image/gif

    # Browser origins allowed to call the API; empty allows none.
    corsAllowOrigins: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      # An upload is held in memory while it is validated and stored.
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
