# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
uploadService:
  name: upload-service
  selectorApp: upload-service-deployment
  containerName: upload-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/upload-service
    tag: latest
    # Must match PORT (see upload_service/config/config.go).
    port: 8080
    pullPolicy: Always

  service:
    name: upload-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: upload-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # The service reads plain environment variables. Dev defaults - override the
  # secrets with --set or a values-prod.yaml before deploying anywhere real.
  env:
    # File metadata.
    mongoURI: mongodb://mongo-svc:80
    mongoDatabase: upload

    # File bytes live in a private bucket of the shared MinIO (chart/minio),
    # created on startup, and are only served through this service.
    minioEndpoint: minio-svc:9000
    minioBucket: upload-service
    minioUseSSL: false
    minioAccessKey: minioadmin
    minioSecretKey: minioadmin123

    # Every route needs a user-service bearer token. With authMode "token" the
    # service refuses to start without userServiceBaseURL.
    authMode: token
    userServiceBaseURL: http://user-api-svc
    authCacheTTL: 5s

    # Other services of the cluster (ticket-service keeps invoices and tickets here) call with this key instead of a user's
    # token (X-Service-Key). Files of the receivers under serviceOnlyReceiverPrefixes can only be reached with it: a user's
    # token cannot list or read them, so the owning service decides who sees what. Both are dev defaults - override the key.
    # Empty prefixes leave every receiver reachable with any valid token.
    serviceApiKey: dev-upload-service-key
    serviceOnlyReceiverPrefixes: "ticket-user:"

    # The type is detected from the file's bytes, not its name.
    maxUploadMB: "20"
    allowedTypes: application/pdf,image/jpeg,image/png,image/webp,image/gif

    # Browser origins allowed to call the API; empty allows none.
    corsAllowOrigins: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      # An upload is held in memory while it is validated and stored.
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT
      value: '{{ .Values.uploadService.image.port }}'
    - name: MONGO_URI
      value: '{{ .Values.uploadService.env.mongoURI }}'
    - name: MONGO_DATABASE
      value: '{{ .Values.uploadService.env.mongoDatabase }}'
    - name: MINIO_ENDPOINT
      value: '{{ .Values.uploadService.env.minioEndpoint }}'
    - name: MINIO_BUCKET
      value: '{{ .Values.uploadService.env.minioBucket }}'
    - name: MINIO_USE_SSL
      value: '{{ .Values.uploadService.env.minioUseSSL }}'
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: upload-service-secret
          key: minioAccessKey
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: upload-service-secret
          key: minioSecretKey
    - name: SERVICE_API_KEY
      valueFrom:
        secretKeyRef:
          name: upload-service-secret
          key: serviceApiKey
    - name: SERVICE_ONLY_RECEIVER_PREFIXES
      value: '{{ .Values.uploadService.env.serviceOnlyReceiverPrefixes }}'
    - name: AUTH_MODE
      value: '{{ .Values.uploadService.env.authMode }}'
    - name: USER_SERVICE_BASE_URL
      value: '{{ .Values.uploadService.env.userServiceBaseURL }}'
    - name: AUTH_CACHE_TTL
      value: '{{ .Values.uploadService.env.authCacheTTL }}'
    - name: UPLOAD_MAX_MB
      value: '{{ .Values.uploadService.env.maxUploadMB }}'
    - name: UPLOAD_ALLOWED_TYPES
      value: '{{ .Values.uploadService.env.allowedTypes }}'
    - name: CORS_ALLOW_ORIGINS
      value: '{{ .Values.uploadService.env.corsAllowOrigins }}'
  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
