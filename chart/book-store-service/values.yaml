bookStoreService:
  name: book-store-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/book-store-service
    tag: latest
    # Must match config.Server.ServerPort as resolved from Consul, or the
    # PORT env var fallback (see book-store-service/config/config.go).
    port: 8000

  service:
    name: book-store-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: book-store-service.local
    path: /
    pathType: Prefix
