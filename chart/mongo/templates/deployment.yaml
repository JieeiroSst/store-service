{{- $rs := .Values.mongo.replicaSet }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.mongo.name}}-deployment
spec:
  selector:
    matchLabels:
      app: {{.Values.mongo.name}}-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{.Values.mongo.name}}-deployment
    spec:
      containers:
      - image: {{.Values.mongo.image.name}}:{{.Values.mongo.image.tag}}
        name: mongodb
        ports:
        - containerPort: {{.Values.mongo.image.port}}
        volumeMounts:
          - name: data
            mountPath: /data/db
        imagePullPolicy: Always
        env:
          - name: NODE_ENV
            value: production
        {{- if $rs.enabled }}
        command:
          - sh
          - -c
          - |
            (
              until mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: '{{ $rs.name }}', members: [{_id: 0, host: '{{ $rs.host }}'}]}).ok }"; do
                sleep 2
              done
            ) &
            exec docker-entrypoint.sh mongod --replSet {{ $rs.name | quote }} --bind_ip_all
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.mongo.name }}-data
