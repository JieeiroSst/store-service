{{- if not .Values.couponService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.couponService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  postgresPassword: {{ .Values.couponService.env.postgresPassword | quote }}
{{- end }}
