shortlinkService:
  name: shortlink-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/shortlink-service
    tag: latest
    # Must match PORT as resolved by internal/config.Load (see
    # shortlink-service/internal/config/config.go).
    port: 3000

  service:
    name: shortlink-service-svc
    type: LoadBalancer

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: shortlink-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
