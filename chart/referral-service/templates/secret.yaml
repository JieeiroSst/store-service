{{- if not .Values.referralService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.referralService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  mysqlPassword: {{ .Values.referralService.env.mysqlPassword | quote }}
  redisPassword: {{ .Values.referralService.env.redisPassword | quote }}
  rabbitmqPassword: {{ .Values.referralService.rabbitmq.password | quote }}
{{- end }}
