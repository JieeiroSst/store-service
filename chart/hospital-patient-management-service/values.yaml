# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
hospitalPatientManagementService:
  name: hospital-patient-management-service
  selectorApp: hospital-patient-management-service-deployment
  containerName: hospital-patient-management-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/hospital-patient-management-service
    tag: latest
    # REST gateway and /health. Must match PORT
    # (see hospital-patient-management-service/config/config.go).
    port: 8080
    # gRPC. Must match GRPC_PORT.
    pullPolicy: Always
    grpcPort: 9090  # keep in sync with extraPorts / service.extraPorts
  extraPorts:
    - name: grpc
      containerPort: 9090
  service:
    name: hospital-patient-management-service-svc
    type: ClusterIP
    port: 80
    extraPorts:
      - name: grpc
        port: 9090
        targetPort: grpc
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: hospital-patient-management-service.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # The service reads plain environment variables. Dev defaults - override the
  # password with --set or a values-prod.yaml before deploying anywhere real.
  # The database is created and the schema migrated on startup; concurrent
  # replicas are serialized with a Postgres advisory lock.
  env:
    # Points at the umbrella chart's postgres (admin credentials from chart/postgres).
    postgresHost: postgresdb
    postgresPort: "80"
    postgresDatabase: hospital_patient_management_service
    postgresUser: testUser
    postgresPassword: testPassword
    postgresSSLMode: disable

    # user-service validates the bearer token of every request. With authMode
    # "token" the service refuses to start without userServiceBaseURL; use
    # "off" only when a trusted gateway in front authenticates callers.
    authMode: token
    userServiceBaseURL: http://user-api-svc
    # How long a validated token is trusted before user-service is asked again,
    # i.e. how long a revoked token keeps working. "0" checks every request.
    authCacheTTL: 5s

    # billing-service: every bill's patient share becomes an invoice there
    # (customer + subscription are created per patient on first use). Empty
    # disables the integration.
    billingBaseURL: http://billing-service-svc
    billingPlanName: Hospital services

    # payment-wallet-service: marking a bill Paid without a paid_date charges
    # the patient's wallet (user_id = walletUserPrefix + patient id) and pays
    # the hospital wallet below. Create and fund that wallet first; leaving
    # the id empty disables wallet payments.
    walletBaseURL: http://payment-wallet-service-svc
    walletHospitalID: ""
    # Minor units per major unit: 100 for cents, 1 for VND.
    walletMinorUnit: "100"
    walletUserPrefix: patient-

    # notification_service: appointment, lab result, bill and payment messages
    # to patients. Empty disables notifications.
    notificationBaseURL: http://notification-service-svc

    # ekyc-service verifies patients' citizen ID and face. A patient must first
    # be linked to a user-service account (PUT /v1/patients/{id}/user). Empty
    # disables the identity endpoints.
    ekycBaseURL: http://ekyc-service-svc

    # upload-service stores files attached to patients (scans, reports) in a
    # private bucket. The caller's own token is forwarded, so upload-service
    # must trust the same user-service. Empty disables the document endpoints.
    uploadBaseURL: http://upload-service-svc

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT
      value: '{{ .Values.hospitalPatientManagementService.image.port }}'
    - name: GRPC_PORT
      value: '{{ .Values.hospitalPatientManagementService.image.grpcPort }}'
    - name: POSTGRES_HOST
      value: '{{ .Values.hospitalPatientManagementService.env.postgresHost }}'
    - name: POSTGRES_PORT
      value: '{{ .Values.hospitalPatientManagementService.env.postgresPort }}'
    - name: POSTGRES_DATABASE
      value: '{{ .Values.hospitalPatientManagementService.env.postgresDatabase }}'
    - name: POSTGRES_SSLMODE
      value: '{{ .Values.hospitalPatientManagementService.env.postgresSSLMode }}'
    - name: POSTGRES_USER
      value: '{{ .Values.hospitalPatientManagementService.env.postgresUser }}'
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hospital-patient-management-service-secret
          key: postgresPassword
    - name: AUTH_MODE
      value: '{{ .Values.hospitalPatientManagementService.env.authMode }}'
    - name: USER_SERVICE_BASE_URL
      value: '{{ .Values.hospitalPatientManagementService.env.userServiceBaseURL }}'
    - name: BILLING_BASE_URL
      value: '{{ .Values.hospitalPatientManagementService.env.billingBaseURL }}'
    - name: BILLING_PLAN_NAME
      value: '{{ .Values.hospitalPatientManagementService.env.billingPlanName }}'
    - name: WALLET_BASE_URL
      value: '{{ .Values.hospitalPatientManagementService.env.walletBaseURL }}'
      when: '{{ .Values.hospitalPatientManagementService.env.walletHospitalID }}'
    - name: WALLET_HOSPITAL_ID
      value: '{{ .Values.hospitalPatientManagementService.env.walletHospitalID }}'
      when: '{{ .Values.hospitalPatientManagementService.env.walletHospitalID }}'
    - name: WALLET_MINOR_UNIT
      value: '{{ .Values.hospitalPatientManagementService.env.walletMinorUnit }}'
    - name: WALLET_USER_PREFIX
      value: '{{ .Values.hospitalPatientManagementService.env.walletUserPrefix }}'
    - name: NOTIFICATION_BASE_URL
      value: '{{ .Values.hospitalPatientManagementService.env.notificationBaseURL }}'
    - name: EKYC_BASE_URL
      value: '{{ .Values.hospitalPatientManagementService.env.ekycBaseURL }}'
    - name: UPLOAD_BASE_URL
      value: '{{ .Values.hospitalPatientManagementService.env.uploadBaseURL }}'
    - name: AUTH_CACHE_TTL
      value: '{{ .Values.hospitalPatientManagementService.env.authCacheTTL }}'
  probes:
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
