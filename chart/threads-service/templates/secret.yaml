{{- if not .Values.threadsService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.threadsService.name }}-secret
type: Opaque
stringData:
  # Dev defaults from values.yaml - override with --set or a
  # values-prod.yaml before deploying anywhere real.
  postgresPassword: {{ .Values.threadsService.env.postgresPassword | quote }}
  redisPassword: {{ .Values.threadsService.env.redisPassword | quote }}
{{- end }}
