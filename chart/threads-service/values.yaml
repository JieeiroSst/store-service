threadsService:
  name: threads-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/threads-service
    tag: latest
    # Must match config.Server.PortHttpServer as resolved from env/Consul
    # (see threads-service/config/config.go and consul.json).
    port: 8083

  service:
    name: threads-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: threads-service.local
    path: /
    pathType: Prefix

  # Plain env vars the container reads directly (see config.FromEnv) -
  # works standalone even before ops has seeded this service's config into
  # the cluster's shared Consul KV store. jwtSecret must be the same value
  # user_service signs its tokens with.
  env:
    postgresHost: postgresdb
    postgresPort: "80"
    postgresUser: testUser
    postgresPassword: testPassword
    postgresDbname: threads
    postgresSSLMode: "disable"
    # The umbrella chart's shared Redis (chart/redis, service redis-svc,
    # port 6379 - see values.yaml there) has no AUTH configured, so
    # redisPassword is intentionally blank. Post/author caching (see
    # internal/adapter/secondary/cache) and trending-tags sorted sets
    # (internal/adapter/secondary/trending) both key everything under a
    # "cache:"/"trending:" prefix, so sharing this instance with other
    # services' keys is safe without a dedicated logical DB.
    redisAddr: redis-svc:6379
    redisPassword: ""
    redisDB: "0"
    userServiceBaseURL: http://user-service-svc
    userServiceTimeout: 5s
    jwtSecret: changeme

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
