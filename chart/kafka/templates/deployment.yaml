apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.kafka.name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
        app: {{ .Values.kafka.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.kafka.name }}
    spec:
      containers:
      - name: {{ .Values.kafka.name }}
        image: {{ .Values.kafka.image.name }}:{{ .Values.kafka.image.tag }}
        securityContext:
          runAsUser: 0
        resources:
          {{- toYaml .Values.kafka.resources | nindent 10 }}
        ports:
         - containerPort: {{ .Values.kafka.service.port }}
        env:
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: {{ .Values.kafka.zookeeperConnect }}
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "yes"
        - name: KAFKA_CFG_LISTENERS
          value: PLAINTEXT://:{{ .Values.kafka.service.port }}
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: {{ .Values.kafka.advertisedListener }}
        - name: KAFKA_CFG_BROKER_ID
          value: {{ .Values.kafka.brokerId | quote }}
        - name: KAFKA_CFG_BROKER_ID_GENERATION_ENABLE
          value: "false"
