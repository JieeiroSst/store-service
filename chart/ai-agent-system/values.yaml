# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
aiAgentSystem:
  name: ai-agent-system
  selectorApp: ai-agent-system
  containerName: ai-agent-system
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/ai-agent-system
    tag: latest
    port: 8080
    pullPolicy: IfNotPresent

  service:
    name: ai-agent-system-svc
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: ai-agent-system.local
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: false

  # MySQL from chart/mysql (database + user ai_agent_system_svc). Its
  # provisioner creates the credentials Secret in `default`; other namespaces
  # mirror it with an ExternalSecret (values-dev.yaml / values-staging.yaml).
  mysql:
    host: mysql-svc
    port: 80
    database: ai_agent_system
    credentialsSecret: ai-agent-system-db-credentials

  ollama:
    baseUrl: http://ollama-model-py-svc:11435
    model: custom-model

  containerEnv:
    - name: PORT
      value: '{{ .Values.aiAgentSystem.image.port }}'
    - name: OLLAMA_BASE_URL
      value: '{{ .Values.aiAgentSystem.ollama.baseUrl }}'
    - name: OLLAMA_MODEL
      value: '{{ .Values.aiAgentSystem.ollama.model }}'
    - name: MYSQL_HOST
      value: '{{ .Values.aiAgentSystem.mysql.host }}'
    - name: MYSQL_PORT
      value: '{{ .Values.aiAgentSystem.mysql.port }}'
    - name: MYSQL_DATABASE
      value: '{{ .Values.aiAgentSystem.mysql.database }}'
    - name: MYSQL_USER
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.aiAgentSystem.mysql.credentialsSecret }}'
          key: MYSQL_USER
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: '{{ .Values.aiAgentSystem.mysql.credentialsSecret }}'
          key: MYSQL_PASSWORD
  envFile:
    enabled: false
  # /healthz is process liveness; /readyz also pings MySQL.
  probes:
    startup:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 20
      failureThreshold: 3

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: false
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ai-agent-system-db-credentials
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
