# Argo CD: namespace store-dev, auto-synced. CI bumps image.tag on every merge to master.
global:
  environment: dev
aiAgentSystem:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: false
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  # Laptop-sized: small requests so ~70 services fit one docker-desktop node;
  # limits from values.yaml still cap each pod.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  # Copies the Secret the mysql chart created in `default` (see the
  # kubernetes-provider SecretStore in chart/platform/values-dev.yaml).
  externalSecret:
    enabled: true
    data:
      - secretKey: MYSQL_USER
        remoteKey: ai-agent-system-db-credentials
        property: MYSQL_USER
      - secretKey: MYSQL_PASSWORD
        remoteKey: ai-agent-system-db-credentials
        property: MYSQL_PASSWORD
