# Argo CD: namespace store-staging, auto-synced. Promoted from dev with the
# "Promote image" workflow; mirrors prod topology at smaller scale.
global:
  environment: staging
aiAgentSystem:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: false
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
  # Copies the Secret the mysql chart created in `default` (see the
  # kubernetes-provider SecretStore in chart/platform/values-staging.yaml).
  externalSecret:
    enabled: true
    data:
      - secretKey: MYSQL_USER
        remoteKey: ai-agent-system-db-credentials
        property: MYSQL_USER
      - secretKey: MYSQL_PASSWORD
        remoteKey: ai-agent-system-db-credentials
        property: MYSQL_PASSWORD
