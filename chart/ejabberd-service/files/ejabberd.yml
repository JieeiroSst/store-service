{{- $x := .Values.ejabberdService.xmpp }}
hosts:
{{- range $x.hosts }}
  - {{ . | quote }}
{{- end }}

loglevel: {{ $x.loglevel }}
{{- with $x.certfiles }}

certfiles:
{{- range . }}
  - {{ . | quote }}
{{- end }}
{{- end }}

listen:
  -
    port: 5222
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls_required: {{ $x.starttlsRequired }}
  -
    port: 5223
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    tls: true
  -
    port: {{ .Values.ejabberdService.image.port }}
    ip: "::"
    module: ejabberd_http
    request_handlers:
      /api: mod_http_api
{{- if .Values.ejabberdService.httpUpload.enabled }}
      /upload: mod_http_upload
{{- end }}

{{- $us := .Values.ejabberdService.userService }}
{{- $up := .Values.ejabberdService.httpUpload }}
{{- if $up.enabled }}

upload_service:
  url: {{ $up.uploadServiceURL | quote }}
{{- end }}
{{- if .Values.ejabberdService.sql.enabled }}

default_db: sql
sql_type: pgsql
sql_ssl: true
{{- end }}
{{- if $us.enabled }}

auth_method: user_service
user_service:
  url: {{ $us.url | quote }}
  jid_field: {{ $us.jidField }}
  allow_password_login: {{ $us.allowPasswordLogin }}
{{- else if .Values.ejabberdService.sql.enabled }}

auth_method: sql
auth_password_format: {{ $x.authPasswordFormat }}
{{- end }}

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128
{{- with $x.admins }}
  admin:
    user:
{{- range . }}
      - {{ . | quote }}
{{- end }}
{{- end }}
{{- with $x.apiNetworks }}
  api_network:
    ip:
{{- range . }}
      - {{ . | quote }}
{{- end }}
{{- end }}

access_rules:
  local:
    allow: local
  c2s:
    deny: blocked
    allow: all
  trusted_network:
    allow: loopback

api_permissions:
  "admin access":
    who:
      access:
        allow:
          - acl: admin
    what:
      - "*"
      - "!stop"
      - "!start"
{{- if $x.apiNetworks }}
  "cluster services":
    who:
      access:
        allow:
          - acl: api_network
    what:
{{- range $x.apiNetworkCommands }}
      - {{ . | quote }}
{{- end }}
{{- end }}
  "public commands":
    who:
      ip: 127.0.0.1/8
    what:
      - status
      - connected_users_number

shaper:
  normal:
    rate: 3000
    burst_size: 20000
  fast: 100000

shaper_rules:
  max_user_sessions: 10
  max_user_offline_messages:
    5000: admin
    100: all
  c2s_shaper:
    none: admin
    normal: all

modules:
  mod_disco: {}
  mod_http_api: {}
  mod_last: {}
{{- if $up.enabled }}
  mod_http_upload:
    put_url: {{ $up.putURL | quote }}
    max_size: {{ $up.maxSize | int64 }}
{{- end }}
  mod_offline:
    access_max_user_messages: max_user_offline_messages
  mod_ping: {}
{{- if not $us.enabled }}
  mod_register:
    ip_access: trusted_network
{{- end }}
  mod_roster:
    versioning: true
  mod_version:
    show_os: false
