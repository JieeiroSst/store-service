{{- if not .Values.orderProcessingService.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.orderProcessingService.name }}-secret
type: Opaque
stringData:
  # Dev default from values.yaml; values-prod.yaml switches to an ExternalSecret.
  orderDbDsn: {{ .Values.orderProcessingService.env.orderDbDsn | quote }}
  shippingApiKey: {{ .Values.orderProcessingService.env.shippingApiKey | quote }}
{{- end }}
