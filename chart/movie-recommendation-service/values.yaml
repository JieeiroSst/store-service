# Base values for the local umbrella install; values-<env>.yaml overlays are
# layered on top by Argo CD (deploy/argocd).
global:
  environment: local
movieRecommendationService:
  name: movie-recommendation-service
  selectorApp: movie-recommendation-service-deployment
  containerName: movie-recommendation-service-deployment
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/movie-recommendation-service
    tag: latest
    # Must match PORT_HTTP_SERVER (see movie-recommendation-service/config/config.go).
    port: 8080
    pullPolicy: Always

  service:
    name: movie-recommendation-service-svc
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: movie-recommendation-service.local
    path: /api/recommendations
    pathType: Prefix
    tls:
      enabled: false
      secretName: ''

  # Dev defaults - override the password with --set or a values-prod.yaml
  # before deploying anywhere real. The database is created and the schema
  # migrated on startup; concurrent replicas are serialized with a Postgres
  # advisory lock. Each replica keeps its own in-memory model, so scaling out
  # needs no coordination.
  env:
    allowedOrigins: "*"
    # Points at the umbrella chart's postgres (admin credentials from chart/postgres).
    postgresHost: postgresdb
    postgresPort: "80"
    postgresDatabase: movie_recommendation_service
    postgresUser: testUser
    postgresPassword: testPassword
    postgresSSLMode: disable

    # Catalog source: the videos to recommend are mirrored from video-service.
    # Empty disables the sync (register videos with PUT /api/recommendations/videos/:id).
    videoServiceBaseURL: http://video-service-svc
    syncIntervalSeconds: "300"
    # Interactions arrive continuously; retrain this often between syncs.
    trainIntervalSeconds: "60"
    trainWindowDays: "90"
    # How fast an interaction stops counting toward "trending".
    trendingHalfLifeHours: "168"
    # How fast a new video's "fresh" bonus fades (cold start for new uploads).
    newHalfLifeDays: "14"
    # Penalty for near-duplicates within a feed; "0" disables re-ordering.
    diversity: "0.25"
    # How long a client can keep paging one ranking (?snapshot= token). The
    # ranking is stored in Postgres, so any replica can serve the next page.
    snapshotTTLMinutes: "15"
    # Where those snapshots live. Empty = Postgres (one row per multi-page
    # feed load). Set to the umbrella chart's redis (e.g. redis-svc:80) for
    # high feed traffic: keys expire natively, nothing is written to Postgres.
    redisAddr: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  containerEnv:
    - name: PORT_HTTP_SERVER
      value: '{{ .Values.movieRecommendationService.image.port }}'
    - name: ALLOWED_ORIGINS
      value: '{{ .Values.movieRecommendationService.env.allowedOrigins }}'
    - name: POSTGRES_HOST
      value: '{{ .Values.movieRecommendationService.env.postgresHost }}'
    - name: POSTGRES_PORT
      value: '{{ .Values.movieRecommendationService.env.postgresPort }}'
    - name: POSTGRES_DATABASE
      value: '{{ .Values.movieRecommendationService.env.postgresDatabase }}'
    - name: POSTGRES_SSLMODE
      value: '{{ .Values.movieRecommendationService.env.postgresSSLMode }}'
    - name: POSTGRES_USER
      value: '{{ .Values.movieRecommendationService.env.postgresUser }}'
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: movie-recommendation-service-secret
          key: postgresPassword
    - name: VIDEO_SERVICE_BASE_URL
      value: '{{ .Values.movieRecommendationService.env.videoServiceBaseURL }}'
    - name: SYNC_INTERVAL_SECONDS
      value: '{{ .Values.movieRecommendationService.env.syncIntervalSeconds }}'
    - name: TRAIN_INTERVAL_SECONDS
      value: '{{ .Values.movieRecommendationService.env.trainIntervalSeconds }}'
    - name: TRAIN_WINDOW_DAYS
      value: '{{ .Values.movieRecommendationService.env.trainWindowDays }}'
    - name: REDIS_ADDR
      value: '{{ .Values.movieRecommendationService.env.redisAddr }}'
      when: '{{ .Values.movieRecommendationService.env.redisAddr }}'
    - name: NEW_HALF_LIFE_DAYS
      value: '{{ .Values.movieRecommendationService.env.newHalfLifeDays }}'
    - name: DIVERSITY
      value: '{{ .Values.movieRecommendationService.env.diversity }}'
    - name: SNAPSHOT_TTL_MINUTES
      value: '{{ .Values.movieRecommendationService.env.snapshotTTLMinutes }}'
    - name: TRENDING_HALF_LIFE_HOURS
      value: '{{ .Values.movieRecommendationService.env.trendingHalfLifeHours }}'
  probes:
    readiness:
      httpGet:
        path: /readyz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20

  # Production contract, see chart/common/templates
  strategy:
    maxSurge: 25%
    maxUnavailable: 0
  revisionHistoryLimit: 5
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  serviceAccount:
    create: true
    name: ''
    annotations: {}
    automountToken: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  podAnnotations: {}
  podLabels: {}
  networkLabels:
    consulClient: true
    internet: false
  priorityClassName: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread:
    enabled: false
  pdb:
    enabled: false
    maxUnavailable: 1
  networkPolicy:
    enabled: false
    allowFromApps: []
    allowToApps: []
    ingress: []
    egress: []
  metrics:
    enabled: false
    path: /metrics
    port: ''
    serviceMonitor:
      enabled: false
      interval: 30s
  externalSecret:
    enabled: false
    targetName: ''
    refreshInterval: 1h
    secretStoreRef:
      kind: SecretStore
      name: store-secrets
    data: []
