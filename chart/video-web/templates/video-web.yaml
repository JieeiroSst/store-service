apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.videoWeb.name }}-deployment
spec:
{{- if not .Values.videoWeb.autoscaling.enabled }}
  replicas: {{ .Values.videoWeb.replicas }}
{{- end }}
  selector:
    matchLabels:
      app: {{ .Values.videoWeb.name }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.videoWeb.name }}-deployment
    spec:
      containers:
      - name: {{ .Values.videoWeb.name }}-deployment
        image: {{ .Values.videoWeb.image.name }}:{{ .Values.videoWeb.image.tag }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.videoWeb.image.port }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.videoWeb.image.port }}
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.videoWeb.image.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.videoWeb.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.videoWeb.service.name }}
spec:
  type: {{ .Values.videoWeb.service.type }}
  ports:
  - port: 80
    targetPort: {{ .Values.videoWeb.image.port }}
  selector:
    app: {{ .Values.videoWeb.name }}-deployment
