videoWeb:
  name: video-web
  replicas: 2

  image:
    name: ghcr.io/jieeirosst/video-web
    tag: latest
    port: 80

  service:
    name: video-web-svc
    type: ClusterIP

  # Same host as chart/video-service's ingress: this one serves "/" and that
  # one serves "/api", so the browser talks to the API on the same origin and
  # video bytes never pass through these pods.
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: video-service.local
    path: /
    pathType: Prefix

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
