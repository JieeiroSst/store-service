# Argo CD: namespace store-staging, auto-synced. Promoted from dev with the
# "Promote image" workflow; mirrors prod topology at smaller scale.
global:
  environment: staging
videoWeb:
  image:
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  ingress:
    enabled: true
    host: videos.staging.store.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  networkLabels:
    consulClient: true
    internet: false
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    maxUnavailable: 1
  topologySpread:
    enabled: true
