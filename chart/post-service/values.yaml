postService:
  name: post-service
  replicas: 1

  image:
    name: ghcr.io/jieeirosst/post-service
    tag: latest
    # Must match config.Server.PortHttpServer as resolved from env/Consul
    # (see post_service/config/config.go and consul.json).
    port: 1236

  service:
    name: post-service-svc
    type: ClusterIP

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    host: post-service.local
    path: /
    pathType: Prefix

  # Plain env vars the container reads directly (see config.FromEnv) -
  # works standalone even before ops has seeded this service's config into
  # the cluster's shared Consul KV store, and before the mysql chart's
  # provisioner job (see chart/mysql's serviceDatabases) has patched
  # Consul with a dedicated post_service_svc user. jwtSecret must be the
  # same value the token issuer (e.g. user_service) signs with.
  env:
    mysqlHost: mysql-svc
    mysqlPort: "80"
    mysqlUser: root
    mysqlPassword: password
    mysqlDbname: post_service
    minioEndpoint: minio-svc:9000
    minioAccessKey: minioadmin
    minioSecretKey: minioadmin123
    minioBucket: post-service
    minioUseSSL: "false"
    jwtSecret: changeme

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
