apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.vendingMachineService.name }}-consul-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: consul-kv-seed
          image: alpine:3.20
          env:
            - name: CONSUL_ADDR
              value: {{ .Values.vendingMachineService.consul.addr | quote }}
            - name: CONSUL_KEY
              value: {{ .Values.vendingMachineService.consul.key | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl >/dev/null

              until curl -sf "$CONSUL_ADDR/v1/status/leader" >/dev/null; do
                echo "waiting for consul..."
                sleep 2
              done

              existing=$(curl -sf "$CONSUL_ADDR/v1/kv/$CONSUL_KEY?raw" || true)
              if [ -n "$existing" ]; then
                echo "consul key $CONSUL_KEY already present, leaving as-is"
                exit 0
              fi

              curl -sf -X PUT --data-binary "@/seed/$CONSUL_KEY.json" "$CONSUL_ADDR/v1/kv/$CONSUL_KEY" >/dev/null
              echo "seeded consul key $CONSUL_KEY"
          volumeMounts:
            - name: seed
              mountPath: /seed
      volumes:
        - name: seed
          configMap:
            name: {{ .Values.vendingMachineService.name }}-consul-seed
