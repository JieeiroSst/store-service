apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.vendingMachineService.service.name }}
  labels:
    app: {{ .Values.vendingMachineService.name }}
spec:
  type: {{ .Values.vendingMachineService.service.type }}
  selector:
    app: {{ .Values.vendingMachineService.name }}
  ports:
  - name: http
    port: 80
    targetPort: {{ .Values.vendingMachineService.image.port }}
