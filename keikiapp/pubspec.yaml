name: keikiapp
description: "Keiki super app: wallet, food, shopping and chat mini-apps on top of gateway-api."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.1.1
  http: ^1.2.0
  flutter_secure_storage: ^11.2.0
  uuid: ^4.3.3
  intl: ^0.20.3
  http_parser: ^4.1.2
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_svg: ^2.3.0
  video_player: ^2.14.1
  flutter_webrtc: ^1.6.2+hotfix.4
  web_socket_channel: ^3.0.3
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  flutter_branch_sdk: ^9.3.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  gql: ^1.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/gateway_schema.json
    - assets/brand/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
