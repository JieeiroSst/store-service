spring.application.name=food-service

# Local defaults only. Deployments override these with SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, REDIS_HOST, REDIS_PORT,
# REDIS_USER and REDIS_PASSWORD (see chart/food-service); never commit real credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/food_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

redis.host=localhost
redis.port=6379
redis.user=default
redis.password=
