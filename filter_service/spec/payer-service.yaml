service: payer-service
source: payer-service/internal/delivery/http/v1/transactions.go
namespace: payerService
prefix: Payer
baseURL: http://payer-service:8080
endpoints:
  - field: transaction
    path: /api/v1/transaction
    query: { transaction_id: Int! }
    returns: PayerTransactionResponse
    unwrap: data
types: |
  type PayerTransactionResponse {
    transaction: PayerTransactions
    payers: PayerPayers
    buyers: PayerBuyers
  }

  type PayerTransactions {
    transaction_id: Int
    payer_id: Int
    buyer_id: Int
    amount: Float
    transaction_date: String
    transaction_type: Int
    description: String
    status: Int
  }

  type PayerPayers {
    payer_id: Int
    name: String
    email: String
    phone_number: String
  }

  type PayerBuyers {
    buyer_id: Int
    name: String
    email: String
    phone_number: String
  }

