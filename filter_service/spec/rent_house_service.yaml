service: rent_house_service
source: rent_house_service/internal/adapter/inbound/http/router.go
namespace: rentHouseService
prefix: Rent
baseURL: http://rent-house-service-svc
endpoints:
  - field: homestay
    path: /api/v1/homestays/{id}
    params: { id: Int! }
    returns: RentHomestay
  - field: homestays
    path: /api/v1/homestays
    query: { province_id: Int, district_id: Int, ward_id: Int, type: Int, guests: Int, q: String, model: String, min_price: String, max_price: String, sort: String, limit: Int, cursor: String, amenity_ids: String, checkin: String, checkout: String }
    returns: RentHomestayPage
    doc: amenity_ids is comma separated; checkin/checkout are YYYY-MM-DD.
  - field: availability
    path: /api/v1/homestays/{id}/availability
    params: { id: Int! }
    query: { from: String, to: String }
    returns: "[RentSlot!]"
  - field: amenities
    path: /api/v1/amenities
    returns: "[RentAmenity!]"
  - field: myHomestays
    path: /api/v1/my/homestays
    query: { limit: Int, offset: Int }
    returns: "[RentHomestay!]"
  - field: homestayReviewQueue
    path: /api/v1/admin/homestays
    query: { status: String, limit: Int, offset: Int }
    returns: "[RentHomestay!]"
  - field: bookings
    path: /api/v1/bookings
    query: { user_id: Int, as: String, limit: Int, offset: Int }
    returns: "[RentBooking!]"
  - field: booking
    path: /api/v1/bookings/{id}
    params: { id: Int! }
    returns: RentBooking
  - field: rates
    path: /api/v1/homestays/{id}/rates
    params: { id: Int! }
    returns: "[RentRate!]"
  - field: leases
    path: /api/v1/leases
    query: { user_id: Int, as: String, limit: Int, offset: Int }
    returns: "[RentLease!]"
  - field: lease
    path: /api/v1/leases/{id}
    params: { id: Int! }
    returns: RentLease
  - field: invoices
    path: /api/v1/invoices
    query: { limit: Int, offset: Int, status: String, due_before: String }
    returns: "[RentInvoice!]"
  - field: reviews
    path: /api/v1/homestays/{id}/reviews
    params: { id: Int! }
    query: { limit: Int, offset: Int }
    returns: "[RentReview!]"
  - field: wishlist
    path: /api/v1/wishlist
    query: { limit: Int, offset: Int }
    returns: "[RentHomestay!]"
  - field: loyalty
    path: /api/v1/loyalty
    returns: RentLoyalty
  - field: wallet
    path: /api/v1/wallet
    returns: RentWallet
  - field: walletTransactions
    path: /api/v1/wallet/transactions
    query: { limit: Int, offset: Int }
    returns: "[RentWalletTxn!]"
types: |
  type RentHomestay {
    id: Int
    name: String
    description: String
    type: Int
    type_name: String
    status: Int
    status_name: String
    review_note: String
    phone_number: String
    address: String
    ward_id: Int
    district_id: Int
    province_id: Int
    images: [String!]
    guests: Int
    bedrooms: Int
    bathrooms: Int
    amenity_ids: [Int!]
    version: Int
    created_at: String
    updated_at: String
    host_id: Int
    accepts_wallet_payment: Boolean
    rating: Float
    review_count: Int
    rates: [RentRate!]
  }

  type RentHomestayPage {
    items: [RentHomestay!]
    has_more: Boolean
    next_cursor: String
  }

  type RentSlot {
    date: String
    price: String
    status: Int
  }

  type RentAmenity {
    id: Int
    name: String
    icon: String
  }

  type RentBooking {
    id: Int
    user_id: Int
    homestay_id: Int
    checkin_date: String
    checkout_date: String
    nights: Int
    guests: Int
    status: Int
    currency: String
    subtotal: String
    discount: String
    total_amount: String
    note: String
    request_id: String
    created_at: String
    payment_method: String
    payment_ref: String
    paid_at: String
    expires_at: String
  }

  type RentRate {
    model: String
    price: String
    currency: String
    min_periods: Int
    active: Boolean
  }

  type RentLease {
    id: Int
    user_id: Int
    homestay_id: Int
    model: String
    start_date: String
    end_date: String
    periods: Int
    billing_day: Int
    currency: String
    rent: String
    status: String
    note: String
    expires_at: String
    created_at: String
    invoices: [RentInvoice!]
  }

  type RentInvoice {
    id: Int
    lease_id: Int
    user_id: Int
    homestay_id: Int
    period: Int
    period_start: String
    period_end: String
    due_date: String
    amount: String
    status: String
    overdue: Boolean
    payment_method: String
    payment_ref: String
    paid_at: String
  }

  type RentReview {
    id: Int
    homestay_id: Int
    user_id: Int
    booking_id: Int
    lease_id: Int
    rating: Int
    comment: String
    created_at: String
  }

  type RentLoyalty {
    points: Int
    tier: Int
    tier_name: String
  }

  type RentWallet {
    wallet_id: String
    balance: Int
    currency: String
    status: String
  }

  type RentWalletTxn {
    transaction_id: String
    type: String
    amount: Int
    currency: String
    status: String
    reference_id: String
    description: String
    created_at: String
  }

