service: movie-recommendation-service
source: movie-recommendation-service/internal/adapter/primary/http/routes.go
namespace: movieRecommendationService
prefix: Movie
baseURL: http://movie-recommendation-service-svc
endpoints:
  - field: forUser
    path: /api/recommendations/users/{user_id}
    query: { page: Int, page_size: Int, snapshot: String }
    returns: MoviePage
  - field: home
    path: /api/recommendations/users/{user_id}/home
    returns: MovieHome
  - field: continueWatching
    path: /api/recommendations/users/{user_id}/continue-watching
    query: { page: Int, page_size: Int, snapshot: String }
    returns: MoviePage
  - field: history
    path: /api/recommendations/users/{user_id}/history
    query: { page: Int, page_size: Int, snapshot: String }
    returns: MoviePage
  - field: newReleases
    path: /api/recommendations/new
    query: { page: Int, page_size: Int, snapshot: String }
    returns: MoviePage
  - field: similar
    path: /api/recommendations/videos/{id}/similar
    query: { page: Int, page_size: Int, snapshot: String }
    returns: MoviePage
  - field: trending
    path: /api/recommendations/trending
    query: { page: Int, page_size: Int, snapshot: String }
    returns: MoviePage
types: |
  type MoviePage {
    items: [MovieRecommendation!]
    total: Int
    page: Int
    page_size: Int
    snapshot: String
  }

  type MovieHome {
    sections: [MovieSection!]
  }

  type MovieRecommendation {
    video: MovieVideo
    score: Float
    reason: String
    because: MovieVideo
    progress: Float
    at: String
  }

  type MovieSection {
    id: String
    title: String
    items: [MovieRecommendation!]
  }

  type MovieVideo {
    id: String
    title: String
    description: String
    tags: [String!]
    status: String
    duration: Float
    views: Int
    created_at: String
  }

