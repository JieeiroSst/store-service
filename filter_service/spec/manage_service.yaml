types: |
  type KcAdapterConfiguration {
    realm: String
    auth_server_url: String @goTag(key: "json", value: "auth-server-url")
    ssl_required: String @goTag(key: "json", value: "ssl-required")
    resource: String
    credentials: Any
    confidential_port: Int @goTag(key: "json", value: "confidential-port")
  }

  type KcAuthenticationFlowRepresentation {
    alias: String
    authenticationExecutions: [KcAuthenticationExecutionRepresentation!]
    builtIn: Boolean
    description: String
    id: String
    providerId: String
    topLevel: Boolean
  }

  type KcBruteForceStatus {
    numFailures: Int
    disabled: Boolean
    lastIPFailure: String
    lastFailure: Int
  }

  type KcCertResponse {
    keys: [KcCertResponseKey!]
  }

  type KcClient {
    access: Map
    adminUrl: String
    attributes: Map
