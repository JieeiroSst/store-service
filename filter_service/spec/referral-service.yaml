service: referral-service
source: referral-service/internal/adapters/primary/http/handler.go
namespace: referralService
prefix: Referral
baseURL: http://referral-service-svc
endpoints:
  - field: link
    path: /api/v1/referral/link/{ref_code}
    returns: ReferralReferralLink
    unwrap: data
  - field: userLinks
    path: /api/v1/referral/user/{user_id}/links
    query: { limit: Int, cursor: String }
    returns: ReferralLinkList
  - field: status
    path: /api/v1/referral/status
    query: { ref_code: String! }
    returns: ReferralReferralStatusResponse
    unwrap: data
  - field: userStats
    path: /api/v1/referral/user/{user_id}/stats
    returns: ReferralUserReferralStats
    unwrap: data
  - field: shareTargets
    path: /api/v1/referral/share/{ref_code}
    returns: "[ReferralShareTarget!]"
    unwrap: data
  - field: activeRewardProgram
    path: /api/v1/programs/active
    returns: ReferralRewardProgram
    unwrap: data
types: |
  type ReferralLinkList {
    data: [ReferralReferralLink!]
    meta: ReferralPageMeta
  }

  type ReferralPageMeta {
    count: Int
    next_cursor: String
  }

  type ReferralReferralLink {
    ref_code: String
    created_at: Int
    owner_user_id: String
    channel: String
    status: String
    expires_at: Int
    deep_link: String
    platform: String
  }

  type ReferralReferralStatusResponse {
    ref_code: String
    status: String
    invitation_status: String
    owner_user_id: String
    invited_at: Int
    activated_at: Int
    time_to_install_ms: Int
    platform: String
    new_user_id: String
    reward_status: String
    reward_value: Float
  }

  type ReferralUserReferralStats {
    user_id: String
    total_invited: Int
    total_installed: Int
    total_rewarded: Int
    total_reward_amt: Float
    last_active_at: Int
  }

  type ReferralShareTarget {
    channel: String
    label: String
    share_url: String
    qr_url: String
  }

  type ReferralRewardProgram {
    program_id: String
    name: String
    status: String
    tiers: [ReferralRewardTier!]
    created_at: Int
    updated_at: Int
  }

  type ReferralRewardTier {
    min_count: Int
    max_count: Int
    reward_value: Float
  }

