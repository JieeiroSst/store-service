service: airflow-service
source: airflow-service/internal/adapter/primary/http/routes.go
namespace: airflowService
prefix: Airflow
baseURL: http://airflow-service-svc
unwrap: data
endpoints:
  - field: health
    path: /health
    returns: AirflowHealthStatus
    doc: Health of the Airflow metadatabase and scheduler.
  - field: dags
    path: /dags
    query: { limit: Int, offset: Int }
    returns: AirflowDAGList
  - field: dag
    path: /dags/{dagId}
    returns: AirflowDAG
  - field: dagRuns
    path: /dags/{dagId}/dagRuns
    query: { limit: Int, offset: Int }
    returns: AirflowDAGRunList
  - field: dagRun
    path: /dags/{dagId}/dagRuns/{dagRunId}
    returns: AirflowDAGRun
  - field: taskInstances
    path: /dags/{dagId}/dagRuns/{dagRunId}/taskInstances
    returns: AirflowTaskInstanceList
  - field: taskInstance
    path: /dags/{dagId}/dagRuns/{dagRunId}/taskInstances/{taskId}
    returns: AirflowTaskInstance
  - field: variables
    path: /variables
    query: { limit: Int, offset: Int }
    returns: AirflowVariableList
  - field: variable
    path: /variables/{key}
    returns: AirflowVariable
  - field: pools
    path: /pools
    query: { limit: Int, offset: Int }
    returns: AirflowPoolList
  - field: pool
    path: /pools/{name}
    returns: AirflowPool
types: |
  type AirflowHealthStatus {
    metadatabase_status: String
    scheduler_status: String
    latest_scheduler_heartbeat: String
  }

  type AirflowDAGList {
    dags: [AirflowDAG!]
    total_entries: Int
  }

  type AirflowDAG {
    dag_id: String
    is_paused: Boolean
    is_active: Boolean
    is_subdag: Boolean
    owners: [String!]
    description: String
    fileloc: String
  }

  type AirflowDAGRunList {
    dag_runs: [AirflowDAGRun!]
    total_entries: Int
  }

  type AirflowDAGRun {
    dag_id: String
    dag_run_id: String
    logical_date: String
    start_date: String
    end_date: String
    state: String
    external_trigger: Boolean
    conf: Map
    note: String
  }

  type AirflowTaskInstanceList {
    task_instances: [AirflowTaskInstance!]
    total_entries: Int
  }

  type AirflowTaskInstance {
    task_id: String
    dag_id: String
    dag_run_id: String
    execution_date: String
    start_date: String
    end_date: String
    duration: Float
    state: String
    try_number: Int
    map_index: Int
    pool: String
    operator: String
  }

  type AirflowVariableList {
    variables: [AirflowVariable!]
    total_entries: Int
  }

  type AirflowVariable {
    key: String
    value: String
    description: String
  }

  type AirflowPoolList {
    pools: [AirflowPool!]
    total_entries: Int
  }

  type AirflowPool {
    name: String
    slots: Int
    occupied_slots: Int
    used_slots: Int
    queued_slots: Int
    open_slots: Int
    description: String
  }

