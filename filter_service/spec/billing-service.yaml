service: billing-service
source: billing-service/internal/adapter/primary/http/routes.go
namespace: billingService
prefix: Billing
baseURL: http://billing-service-svc
unwrap: data
endpoints:
  - field: addresses
    path: /addresses
    returns: "[BillingAddress!]"
  - field: address
    path: /addresses/{id}
    params: { id: Int! }
    returns: BillingAddress
  - field: customers
    path: /customers
    returns: "[BillingCustomer!]"
  - field: customer
    path: /customers/{id}
    params: { id: Int! }
    returns: BillingCustomer
  - field: plans
    path: /plans
    returns: "[BillingPlan!]"
  - field: plan
    path: /plans/{id}
    params: { id: Int! }
    returns: BillingPlan
  - field: subscriptions
    path: /subscriptions
    returns: "[BillingSubscription!]"
  - field: subscription
    path: /subscriptions/{id}
    params: { id: Int! }
    returns: BillingSubscription
  - field: invoices
    path: /invoices
    returns: "[BillingInvoice!]"
  - field: invoice
    path: /invoices/{id}
    params: { id: Int! }
    returns: BillingInvoice
  - field: transactions
    path: /transactions
    returns: "[BillingTransaction!]"
  - field: transaction
    path: /transactions/{id}
    params: { id: Int! }
    returns: BillingTransaction
types: |
  type BillingAddress {
    address_id: Int
    line1: String
    line2: String
    city: String
    state: String
    postal_code: String
    country: String
  }

  type BillingCustomer {
    customer_id: Int
    name: String
    company: String
    email: String
    phone_number: String
    address_id: Int
  }

  type BillingPlan {
    plan_id: Int
    name: String
    description: String
    price: Float
    billing_cycle: String
  }

  type BillingSubscription {
    subscription_id: Int
    customer_id: Int
    plan_id: Int
    start_date: Int
    end_date: Int
    status: String
  }

  type BillingInvoice {
    invoice_id: Int
    subscription_id: Int
    invoice_date: Int
    due_date: Int
    amount: Float
    tax: String
    status: String
  }

  type BillingTransaction {
    transaction_id: Int
    invoice_id: Int
    payment_method: String
    transaction_date: Int
    amount: Float
    status: String
  }

