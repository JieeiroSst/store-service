service: media-service
source: media-service/internal/delivery/http/v1/video.go
namespace: mediaService
prefix: Media
baseURL: http://media-service:8080
endpoints:
  - field: video
    path: /api/internal/v1/videos/{video_id}/user/{user_id}
    params: { video_id: Int!, user_id: Int! }
    returns: MediaVideo
    unwrap: data
types: |
  type MediaVideo {
    video_id: Int
    description: String
    thumbnail_url: String
    stream_url: String
    tag_id: Int
    uploaded_on: String
    tag: MediaTag
  }

  type MediaTag {
    tag_id: Int
    video_id: Int
    value: String
  }

