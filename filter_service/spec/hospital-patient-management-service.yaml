service: hospital-patient-management-service
source: lib-gateway/hospital-patientm-anagement-service/service.proto (grpc-gateway) + internal/adapter/primary/httpapi
namespace: hospitalPatientManagementService
prefix: Hospital
baseURL: http://hospital-patient-management-service-svc
endpoints:
  - field: getDepartment
    path: /v1/departments/{department_id}
    params: { department_id: Int! }
    query: { "name": String, "description": String, "created_at": String, "updated_at": String }
    returns: HospitalDepartment
    doc: gRPC HospotalService.GetDepartment
  - field: listDepartments
    path: /v1/departments
    query: { "page_size": Int, "page_number": Int }
    returns: HospitalListDepartmentsResponse
    doc: gRPC HospotalService.ListDepartments
  - field: getStaff
    path: /v1/staff/{staff_id}
    params: { staff_id: Int! }
    query: { "department_id": Int, "first_name": String, "last_name": String, "role": String, "specialization": String, "email": String, "phone": String, "hire_date": String, "license_number": String, "created_at": String, "updated_at": String }
    returns: HospitalStaff
    doc: gRPC HospotalService.GetStaff
  - field: listStaff
    path: /v1/staff
    query: { "page_size": Int, "page_number": Int, "department_id": Int }
    returns: HospitalListStaffResponse
    doc: gRPC HospotalService.ListStaff
  - field: getPatient
    path: /v1/patients/{patient_id}
    params: { patient_id: Int! }
    query: { "first_name": String, "last_name": String, "date_of_birth": String, "gender": String, "blood_type": String, "address": String, "phone": String, "email": String, "emergency_contact_name": String, "emergency_contact_phone": String, "insurance_provider": String, "insurance_policy_number": String, "created_at": String, "updated_at": String }
    returns: HospitalPatient
    doc: gRPC HospotalService.GetPatient
  - field: listPatients
    path: /v1/patients
    query: { "page_size": Int, "page_number": Int, "search_term": String }
    returns: HospitalListPatientsResponse
    doc: gRPC HospotalService.ListPatients
  - field: getMedicalRecord
    path: /v1/medical-records/{record_id}
    params: { record_id: Int! }
    query: { "patient_id": Int, "diagnosis": String, "treatment_plan": String, "notes": String, "created_by": Int, "created_at": String, "updated_at": String }
    returns: HospitalMedicalRecord
    doc: gRPC HospotalService.GetMedicalRecord
  - field: listMedicalRecords
    path: /v1/patients/{patient_id}/medical-records
    params: { patient_id: Int! }
    query: { "page_size": Int, "page_number": Int }
    returns: HospitalListMedicalRecordsResponse
    doc: gRPC HospotalService.ListMedicalRecords
  - field: getAppointment
    path: /v1/appointments/{appointment_id}
    params: { appointment_id: Int! }
    query: { "patient_id": Int, "staff_id": Int, "department_id": Int, "appointment_date": String, "status": String, "reason": String, "notes": String, "created_at": String, "updated_at": String }
    returns: HospitalAppointment
    doc: gRPC AppointmentService.GetAppointment
  - field: listAppointments
    path: /v1/appointments
    query: { "page_size": Int, "page_number": Int, "patient_id": Int, "staff_id": Int, "date_from": String, "date_to": String, "status": String }
    returns: HospitalListAppointmentsResponse
    doc: gRPC AppointmentService.ListAppointments
  - field: getPrescription
    path: /v1/prescriptions/{prescription_id}
    params: { prescription_id: Int! }
    query: { "patient_id": Int, "prescribed_by": Int, "medication_name": String, "dosage": String, "frequency": String, "start_date": String, "end_date": String, "instructions": String, "created_at": String, "updated_at": String }
    returns: HospitalPrescription
    doc: gRPC AppointmentService.GetPrescription
  - field: listPrescriptions
    path: /v1/patients/{patient_id}/prescriptions
    params: { patient_id: Int! }
    query: { "page_size": Int, "page_number": Int }
    returns: HospitalListPrescriptionsResponse
    doc: gRPC AppointmentService.ListPrescriptions
  - field: getLabResult
    path: /v1/lab-results/{result_id}
    params: { result_id: Int! }
    query: { "patient_id": Int, "ordered_by": Int, "test_name": String, "test_date": String, "results": String, "normal_range": String, "notes": String, "created_at": String, "updated_at": String }
    returns: HospitalLabResult
    doc: gRPC AppointmentService.GetLabResult
  - field: listLabResults
    path: /v1/patients/{patient_id}/lab-results
    params: { patient_id: Int! }
    query: { "page_size": Int, "page_number": Int }
    returns: HospitalListLabResultsResponse
    doc: gRPC AppointmentService.ListLabResults
  - field: getBilling
    path: /v1/billings/{bill_id}
    params: { bill_id: Int! }
    query: { "patient_id": Int, "appointment_id": Int, "amount": Float, "insurance_covered": Float, "patient_responsibility": Float, "status": String, "due_date": String, "paid_date": String, "created_at": String, "updated_at": String }
    returns: HospitalBilling
    doc: gRPC AppointmentService.GetBilling
  - field: listBillings
    path: /v1/patients/{patient_id}/billings
    params: { patient_id: Int! }
    query: { "page_size": Int, "page_number": Int, "status": String }
    returns: HospitalListBillingsResponse
    doc: gRPC AppointmentService.ListBillings
  - field: getDepartmentStats
    path: /v1/analytics/departments
    returns: HospitalDepartmentStatsResponse
    doc: gRPC AppointmentService.GetDepartmentStats
  - field: getAppointmentStats
    path: /v1/analytics/appointments
    query: { "date_from": String, "date_to": String, "department_id": Int }
    returns: HospitalAppointmentStatsResponse
    doc: gRPC AppointmentService.GetAppointmentStats
  - field: getBillingStats
    path: /v1/analytics/billings
    query: { "date_from": String, "date_to": String }
    returns: HospitalBillingStatsResponse
    doc: gRPC AppointmentService.GetBillingStats
  - field: patientDocuments
    path: /v1/patients/{id}/documents
    params: { id: Int! }
    query: { limit: Int, offset: Int }
    returns: HospitalDocumentList
  - field: patientIdentity
    path: /v1/patients/{id}/identity
    params: { id: Int! }
    returns: HospitalIdentityStatus
types: |
  type HospitalDepartment {
    departmentId: Int
    name: String
    description: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListDepartmentsResponse {
    departments: [HospitalDepartment!]
    totalCount: Int
  }

  type HospitalStaff {
    staffId: Int
    departmentId: Int
    firstName: String
    lastName: String
    role: String
    specialization: String
    email: String
    phone: String
    hireDate: String
    licenseNumber: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListStaffResponse {
    staff: [HospitalStaff!]
    totalCount: Int
  }

  type HospitalPatient {
    patientId: Int
    firstName: String
    lastName: String
    dateOfBirth: String
    gender: String
    bloodType: String
    address: String
    phone: String
    email: String
    emergencyContactName: String
    emergencyContactPhone: String
    insuranceProvider: String
    insurancePolicyNumber: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListPatientsResponse {
    patients: [HospitalPatient!]
    totalCount: Int
  }

  type HospitalMedicalRecord {
    recordId: Int
    patientId: Int
    diagnosis: String
    treatmentPlan: String
    notes: String
    createdBy: Int
    createdAt: String
    updatedAt: String
  }

  type HospitalListMedicalRecordsResponse {
    records: [HospitalMedicalRecord!]
    totalCount: Int
  }

  type HospitalAppointment {
    appointmentId: Int
    patientId: Int
    staffId: Int
    departmentId: Int
    appointmentDate: String
    status: String
    reason: String
    notes: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListAppointmentsResponse {
    appointments: [HospitalAppointment!]
    totalCount: Int
  }

  type HospitalPrescription {
    prescriptionId: Int
    patientId: Int
    prescribedBy: Int
    medicationName: String
    dosage: String
    frequency: String
    startDate: String
    endDate: String
    instructions: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListPrescriptionsResponse {
    prescriptions: [HospitalPrescription!]
    totalCount: Int
  }

  type HospitalLabResult {
    resultId: Int
    patientId: Int
    orderedBy: Int
    testName: String
    testDate: String
    results: String
    normalRange: String
    notes: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListLabResultsResponse {
    labResults: [HospitalLabResult!]
    totalCount: Int
  }

  type HospitalBilling {
    billId: Int
    patientId: Int
    appointmentId: Int
    amount: Float
    insuranceCovered: Float
    patientResponsibility: Float
    status: String
    dueDate: String
    paidDate: String
    createdAt: String
    updatedAt: String
  }

  type HospitalListBillingsResponse {
    billings: [HospitalBilling!]
    totalCount: Int
  }

  type HospitalDepartmentStatsResponse {
    departmentStats: [HospitalDepartmentStatsResponseDepartmentStat!]
  }

  type HospitalDepartmentStatsResponseDepartmentStat {
    departmentId: Int
    departmentName: String
    staffCount: Int
    appointmentCount: Int
  }

  type HospitalAppointmentStatsResponse {
    totalAppointments: Int
    completedAppointments: Int
    cancelledAppointments: Int
    noShowAppointments: Int
    dailyStats: [HospitalAppointmentStatsResponseDailyStats!]
  }

  type HospitalAppointmentStatsResponseDailyStats {
    date: String
    appointmentCount: Int
  }

  type HospitalBillingStatsResponse {
    totalBilled: Float
    totalCollected: Float
    totalOutstanding: Float
    totalInsuranceCovered: Float
    totalPatientResponsibility: Float
    monthlyStats: [HospitalBillingStatsResponseMonthlyStats!]
  }

  type HospitalBillingStatsResponseMonthlyStats {
    month: String
    amountBilled: Float
    amountCollected: Float
  }

  type HospitalDocument {
    id: String
    patient_id: Int
    file_name: String
    content_type: String
    size: Int
    created_at: String
  }

  type HospitalDocumentList {
    documents: [HospitalDocument!]
    total_count: Int
  }

  type HospitalIdentityStatus {
    patient_id: Int
    status: String
    match_score: Float
    verified_at: String
    has_citizen_card: Boolean
    has_face_scan: Boolean
  }
