service: car-rental-service
source: lib-gateway/car-rental-servcie/service.proto (grpc-gateway)
namespace: carRentalService
prefix: CarRental
baseURL: http://car-rental-service-svc
endpoints:
  - field: getUser
    path: /api/v1/users/{user_id}
    params: { user_id: String! }
    returns: CarRentalUserResponse
    doc: gRPC VehicleRentalService.GetUser
  - field: getVehicle
    path: /api/v1/vehicles/{vehicle_id}
    params: { vehicle_id: String! }
    returns: CarRentalVehicleResponse
    doc: gRPC VehicleRentalService.GetVehicle
  - field: listVehicles
    path: /api/v1/vehicles
    query: { "page_size": Int, "page_token": String, "vehicle_type": String, "location_id": String }
    returns: CarRentalListVehiclesResponse
    doc: gRPC VehicleRentalService.ListVehicles
  - field: searchAvailableVehicles
    path: /api/v1/vehicles/available
    query: { "start_time": String, "end_time": String, "pickup_location_id": String, "return_location_id": String, "vehicle_type": String, "category_id": String, "page_size": Int, "page_token": String }
    returns: CarRentalListVehiclesResponse
    doc: gRPC VehicleRentalService.SearchAvailableVehicles
  - field: getReservation
    path: /api/v1/reservations/{reservation_id}
    params: { reservation_id: String! }
    returns: CarRentalReservationResponse
    doc: gRPC VehicleRentalService.GetReservation
  - field: listUserReservations
    path: /api/v1/users/{user_id}/reservations
    params: { user_id: String! }
    query: { "status": String, "page_size": Int, "page_token": String }
    returns: CarRentalListReservationsResponse
    doc: gRPC VehicleRentalService.ListUserReservations
  - field: getRental
    path: /api/v1/rentals/{rental_id}
    params: { rental_id: String! }
    returns: CarRentalRentalResponse
    doc: gRPC VehicleRentalService.GetRental
  - field: listUserRentals
    path: /api/v1/users/{user_id}/rentals
    params: { user_id: String! }
    query: { "status": String, "page_size": Int, "page_token": String }
    returns: CarRentalListRentalsResponse
    doc: gRPC VehicleRentalService.ListUserRentals
  - field: listVehicleReviews
    path: /api/v1/vehicles/{vehicle_id}/reviews
    params: { vehicle_id: String! }
    query: { "page_size": Int, "page_token": String }
    returns: CarRentalListReviewsResponse
    doc: gRPC VehicleRentalService.ListVehicleReviews
  - field: listLocations
    path: /api/v1/locations
    query: { "city": String, "state": String, "country": String, "page_size": Int, "page_token": String }
    returns: CarRentalListLocationsResponse
    doc: gRPC VehicleRentalService.ListLocations
types: |
  type CarRentalUserResponse {
    userId: String
    email: String
    firstName: String
    lastName: String
    phoneNumber: String
    address: String
    userType: String
    drivingLicense: String
    createdAt: String
    updatedAt: String
  }

  type CarRentalVehicleResponse {
    vehicleId: String
    categoryId: String
    registrationNumber: String
    make: String
    model: String
    year: Int
    color: String
    mileage: Float
    status: String
    hourlyRate: Float
    dailyRate: Float
    locationId: String
    vehicleType: String
    features: Map
    carDetails: CarRentalCarDetails
    motorcycleDetails: CarRentalMotorcycleDetails
    bicycleDetails: CarRentalBicycleDetails
  }

  type CarRentalCarDetails {
    fuelType: String
    transmission: String
    seatingCapacity: Int
    trunkCapacity: Float
    airConditioning: Boolean
  }

  type CarRentalMotorcycleDetails {
    engineCapacity: Int
    motorcycleType: String
    helmetIncluded: Boolean
  }

  type CarRentalBicycleDetails {
    bicycleType: String
    frameSize: String
    gearCount: Int
    hasBasket: Boolean
  }

  type CarRentalListVehiclesResponse {
    vehicles: [CarRentalVehicleResponse!]
    nextPageToken: String
    totalCount: Int
  }

  type CarRentalReservationResponse {
    reservationId: String
    userId: String
    vehicleId: String
    pickupLocationId: String
    returnLocationId: String
    startTime: String
    endTime: String
    status: String
    createdAt: String
    updatedAt: String
    vehicle: CarRentalVehicleResponse
  }

  type CarRentalListReservationsResponse {
    reservations: [CarRentalReservationResponse!]
    nextPageToken: String
    totalCount: Int
  }

  type CarRentalRentalResponse {
    rentalId: String
    reservationId: String
    vehicleId: String
    userId: String
    pickupTime: String
    actualReturnTime: String
    pickupLocationId: String
    returnLocationId: String
    pickupMileage: Float
    returnMileage: Float
    status: String
    baseFee: Float
    additionalFees: Float
    paymentStatus: String
    vehicle: CarRentalVehicleResponse
    createdAt: String
  }

  type CarRentalListRentalsResponse {
    rentals: [CarRentalRentalResponse!]
    nextPageToken: String
    totalCount: Int
  }

  type CarRentalListReviewsResponse {
    reviews: [CarRentalReviewResponse!]
    nextPageToken: String
    totalCount: Int
  }

  type CarRentalReviewResponse {
    reviewId: String
    rentalId: String
    userId: String
    vehicleId: String
    rating: Int
    comment: String
    createdAt: String
    user: CarRentalUserResponse
  }

  type CarRentalListLocationsResponse {
    locations: [CarRentalLocationResponse!]
    nextPageToken: String
    totalCount: Int
  }

  type CarRentalLocationResponse {
    locationId: String
    name: String
    address: String
    city: String
    state: String
    country: String
    zipCode: String
    latitude: Float
    longitude: Float
    contactPhone: String
    openingHours: Map
  }
