# Local stack: MySQL + room-service (BE) + web (FE).
# room-service needs a reachable user-service gRPC endpoint for login; point
# USER_SERVICE_GRPC_ADDR at it (host.docker.internal reaches one on your machine).
services:
  mysql:
    image: mysql:8.0
    container_name: chat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: chatdb
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass123
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5

  room-service:
    build: ./BE
    restart: unless-stopped
    environment:
      PORT_HTTP_SERVER: "8081"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: chatdb
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass123
      USER_SERVICE_GRPC_ADDR: ${USER_SERVICE_GRPC_ADDR:-host.docker.internal:1236}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./FE
      args:
        # No ingress here to route /api, so the browser calls the BE directly.
        REACT_APP_API_URL: http://localhost:8081
    ports:
      - "3000:80"
    depends_on:
      - room-service
