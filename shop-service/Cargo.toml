[package]
name = "shop-service"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0"
dotenvy = "0.15"
serde_derive = "1.0"
juniper = "0.17"
diesel = { version = "2.2", features = ["postgres", "r2d2", "chrono", "uuid"] }
futures = "0.3"
env_logger = "0.11"

async-trait = "0.1"
actix-cors = "0.7"
actix-files = "0.6"
actix-identity = "0.8"
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-service = "2"
actix-rt = "2"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

argon2 = "0.5"
derive_more = { version = "1", features = ["full"] }
r2d2 = "0.8"

serde = { version = "1.0", features = ["derive"] }

soa_derive = "0.13"

tonic = "0.12"
