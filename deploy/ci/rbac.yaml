apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-runner
  namespace: ci
rules:
  # Pipeline state (last processed commit).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch]
  # Argo Workflows executor reports step results through these.
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-runner
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-runner
subjects:
  - kind: ServiceAccount
    name: ci-runner
    namespace: ci
