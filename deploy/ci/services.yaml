# Services the in-cluster CI (deploy/ci) builds. Generated from
# .github/workflows/*-cicd.yml; one entry per chart.
#   context      Docker build context (repo-relative); a push touching it rebuilds the service
#   image        repository name in the local registry (localhost:5000/<image>)
#   helmKeys     values keys whose image.name/tag Argo CD Image Updater overrides in store-dev
#   lang/goVersion, testEnv, testServices   how the test step runs (go: go vet + go test,
#                                           scala: sbt test; others build-only)
