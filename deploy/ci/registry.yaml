# Image registry for locally built images. The hostPort makes it reachable
# as localhost:5000 from the node's Docker daemon (pushes by the build step,
# pulls by kubelet - Docker treats localhost registries as trusted over HTTP);
# the Service is how Argo CD Image Updater lists tags from inside the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: ci
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ci
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3
          ports:
            - name: http
              containerPort: 5000
              hostPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ci
spec:
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
