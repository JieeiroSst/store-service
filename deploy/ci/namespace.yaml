apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    app.kubernetes.io/part-of: store-ci
    # Builds talk to the node's Docker daemon through a hostPath socket.
    # Local clusters only - never run this namespace on a shared cluster.
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
