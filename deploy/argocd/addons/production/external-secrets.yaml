apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-external-secrets
  namespace: argocd
  annotations:
    # Add-ons (CRDs, ingress controller) come up before the store apps.
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: store-addons
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
