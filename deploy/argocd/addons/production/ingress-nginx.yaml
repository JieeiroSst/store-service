apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-ingress-nginx
  namespace: argocd
  annotations:
    # Add-ons (CRDs, ingress controller) come up before the store apps.
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: store-addons
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          replicaCount: 3
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          allowSnippetAnnotations: false
          config:
            use-forwarded-headers: "true"
            enable-real-ip: "true"
          podDisruptionBudget:
            enabled: true
            minAvailable: 2
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          metrics:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
