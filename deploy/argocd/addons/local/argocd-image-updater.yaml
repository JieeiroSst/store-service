apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: store-addons
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      releaseName: argocd-image-updater
      valuesObject:
        extraArgs:
          # New local builds reach store-dev within ~30s of being pushed.
          - --interval
          - 30s
        config:
          registries:
            # Images are named localhost:5000/... (what the node's Docker daemon
            # pulls); the updater lists their tags through the in-cluster Service.
            - name: local
              prefix: localhost:5000
              api_url: http://registry.ci.svc.cluster.local:5000
              insecure: yes
              ping: no
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
