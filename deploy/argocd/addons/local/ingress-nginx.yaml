apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-ingress-nginx
  namespace: argocd
  annotations:
    # Add-ons (CRDs, ingress controller) come up before the store apps.
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: store-addons
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          # docker-desktop publishes LoadBalancer ports on localhost; 80/443 are
          # already taken by the umbrella chart's nginx-loadbalancer, so local
          # ingress lives on :8081 (http) and :8443 (https).
          service:
            type: LoadBalancer
            ports:
              http: 8081
              https: 8443
          allowSnippetAnnotations: false
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          metrics:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
