# App-of-apps for a laptop cluster (docker-desktop): store-dev only, plus
# the add-ons it needs. deploy/bootstrap-local.sh applies this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: store-root-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JieeiroSst/store-service.git
    targetRevision: master
    path: deploy/argocd
    directory:
      recurse: true
      include: "{projects.yaml,applicationsets/*-dev.yaml,addons/local/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
