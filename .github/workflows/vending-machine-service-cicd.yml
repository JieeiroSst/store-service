name: Vending Machine Service CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'vending-machine-service/**'
      - 'chart/vending-machine-service/**'
      - '.github/workflows/vending-machine-service-cicd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/vending-machine-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The postgres adapter tests (migrations, row locking) run against a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check chart consul.json is in sync
        run: diff vending-machine-service/consul.json chart/vending-machine-service/files/consul.json

      - name: Build
        run: cd vending-machine-service && go build -v ./...

      - name: Vet
        run: cd vending-machine-service && go vet ./...

      - name: Test
        run: cd vending-machine-service && go test -race -v ./...

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./vending-machine-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy vending machine service
        run: |
          helm template ./chart/vending-machine-service \
          --namespace default \
          --set vendingMachineService.image.name=${{ env.IMAGE_NAME }} \
          --set vendingMachineService.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
          | kubectl apply -n default -f -
          kubectl rollout status deployment/vending-machine-service-deployment -n default --timeout=5m
