name: Book Service CI/CD

# Day-to-day builds run in the local cluster (deploy/ci): every push to
# master is tested (sbt test) and built there, then rolled out to store-dev.
# This workflow only publishes a release image to ghcr.io for staging/prod -
# run it by hand (Actions -> Run workflow), then promote the tag with promote.yml.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/book-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Content storage is replaced by an in-memory store in tests; no MinIO needed.
      - name: Test
        working-directory: book-service
        run: sbt -batch test

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./book-service
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      # Block the rollout on fixable critical CVEs in the pushed image.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
