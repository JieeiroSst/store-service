name: Automatic Payment Service CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'automatic-payment-service/**'
      - 'chart/automatic-payment-service/**'
      - '.github/workflows/automatic-payment-service-cicd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/automatic-payment-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: Build
        run: cd automatic-payment-service && go build -v ./...

      - name: Test
        run: cd automatic-payment-service && go test -v ./...

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          for i in 1 2 3; do
            docker buildx build \
              --builder "${{ steps.buildx.outputs.name }}" \
              --platform linux/amd64,linux/arm64 \
              --tag "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" \
              --tag "${{ env.IMAGE_NAME }}:latest" \
              --push \
              ./automatic-payment-service && exit 0
            echo "Build attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Helm upgrade automatic payment service
        run: |
          helm upgrade --install automatic-payment-service ./chart/automatic-payment-service \
            --namespace default \
            --set automaticPayment.image.name=${{ env.IMAGE_NAME }} \
            --set automaticPayment.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 5m
