name: Room Web CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'room-service/FE/**'
      - 'chart/room-web/**'
      - '.github/workflows/room-web-cicd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/room-web

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: room-service/FE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: room-service/FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI=true makes CRA fail the build on lint warnings.
      - name: Build
        run: npm run build
        env:
          CI: "true"

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./room-service/FE
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy room web
        # Resources are owned by the umbrella "chart-1785009827" helm release (chart/),
        # not a standalone release - render+apply directly to avoid ownership conflicts.
        run: |
          helm template ./chart/room-web \
          --namespace default \
          --set roomWeb.image.name=${{ env.IMAGE_NAME }} \
          --set roomWeb.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
          | kubectl apply -n default -f -
          kubectl rollout status deployment/room-web-deployment -n default --timeout=5m
