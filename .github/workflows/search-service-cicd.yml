name: Search Service CI/CD

# Day-to-day builds run in the local cluster (deploy/ci): every push to
# master is built there and rolled out to store-dev. This workflow only
# publishes a release image to ghcr.io for staging/prod - run it by hand
# (Actions -> Run workflow), then promote the tag with promote.yml.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/search-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check chart consul.json is in sync
        run: diff search-service/consul.json chart/search-service/files/consul.json

      - name: Build
        run: cd search-service && make build

      - name: Vet
        run: cd search-service && make vet

      # The elasticsearch adapter integration test runs against the service container above.
      - name: Test
        env:
          SEARCH_TEST_ES_URL: http://localhost:9200
        run: cd search-service && make test

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./search-service
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      # Block the rollout on fixable critical CVEs in the pushed image.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
