name: AI Agent System CI/CD

# Day-to-day builds run in the local cluster (deploy/ci): every push to
# master is built there and rolled out to store-dev. This workflow only
# publishes a release image to ghcr.io for staging/prod - run it by hand
# (Actions -> Run workflow), then promote the tag with promote.yml
# (service: ai-agent-system).
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/ai-agent-system

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: aiagent
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ai-agent-system/go.mod
          cache-dependency-path: ai-agent-system/go.sum

      - name: Format
        run: cd ai-agent-system && make fmt-check

      - name: Build
        run: cd ai-agent-system && make build

      - name: Vet
        run: cd ai-agent-system && make vet

      - name: Test
        env:
          AI_AGENT_TEST_MYSQL_ADDR: 127.0.0.1:3306
          AI_AGENT_TEST_MYSQL_USER: root
          AI_AGENT_TEST_MYSQL_PASSWORD: pw
          AI_AGENT_TEST_MYSQL_DATABASE: aiagent
        run: cd ai-agent-system && make test

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ai-agent-system
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      # Block the rollout on fixable critical CVEs in the pushed image.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
