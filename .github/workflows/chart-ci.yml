name: Chart CI

# Renders every chart that opted into GitOps (has values-<env>.yaml) for every
# environment and validates the output against the Kubernetes schemas, so a
# broken overlay fails here instead of in Argo CD.
on:
  pull_request:
    paths:
      - 'chart/**'
      - 'deploy/argocd/**'
      - '.github/workflows/chart-ci.yml'

permissions:
  contents: read

env:
  HELM_VERSION: v4.2.3
  KUBECONFORM_VERSION: v0.6.7
  KUBERNETES_VERSION: 1.31.0

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Render and validate
        working-directory: chart
        run: |
          set -uo pipefail
          failed=0
          for chart in $(ls -d */ | tr -d / | sort); do
            ls "$chart"/values-*.yaml >/dev/null 2>&1 || continue
            [ "$chart" = platform ] || helm dependency build "$chart" >/dev/null || { echo "::error::$chart: helm dependency build failed"; failed=1; continue; }
            for overlay in "$chart"/values-*.yaml; do
              env=$(basename "$overlay" .yaml); env=${env#values-}
              if ! helm template "$chart" "./$chart" -n "store-$env" -f "$chart/values.yaml" -f "$overlay" \
                | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'; then
                echo "::error file=chart/$overlay::$chart ($env) does not render to valid manifests"
                failed=1
              fi
            done
          done
          exit $failed

  argocd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate Argo CD manifests
        run: |
          find deploy/argocd -name '*.yaml' -not -path '*/install/*' -print0 \
            | xargs -0 kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
