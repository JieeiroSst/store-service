name: Booking Mini Service CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'booking-mini-service/**'
      - 'chart/booking-mini-service/**'
      - '.github/workflows/booking-mini-service-cicd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jieeirosst/booking-mini-service
  SQLX_OFFLINE: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            booking-mini-service/target
          key: ${{ runner.os }}-cargo-booking-mini-service-${{ hashFiles('booking-mini-service/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-booking-mini-service-

      - name: Build
        run: cd booking-mini-service && cargo build --verbose

      - name: Test
        run: cd booking-mini-service && cargo test --verbose

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./booking-mini-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Helm upgrade booking mini service
        run: |
          helm upgrade --install booking-mini-service ./chart/booking-mini-service \
            --namespace default \
            --set bookingMiniService.image.name=${{ env.IMAGE_NAME }} \
            --set bookingMiniService.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --wait --timeout 5m
