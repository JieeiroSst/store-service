name: Keiki App Build

# Builds the keikiapp Flutter client. Run it by hand (Actions -> Run workflow).
# The iOS job runs on a macOS runner because building for iOS needs Xcode; it
# produces an unsigned Runner.app (no Apple signing identity is configured).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: gateway-api base URL baked into the build
        required: false
        default: ""

env:
  FLUTTER_VERSION: "3.47.7"
  DART_DEFINES: >-
    --dart-define=API_URL=${{ inputs.api_url || vars.KEIKI_API_URL }}
    --dart-define=FIREBASE_API_KEY=${{ secrets.KEIKI_FIREBASE_API_KEY }}
    --dart-define=FIREBASE_APP_ID=${{ secrets.KEIKI_FIREBASE_APP_ID }}
    --dart-define=FIREBASE_SENDER_ID=${{ secrets.KEIKI_FIREBASE_SENDER_ID }}
    --dart-define=FIREBASE_PROJECT_ID=${{ secrets.KEIKI_FIREBASE_PROJECT_ID }}
    --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ vars.KEIKI_IOS_BUNDLE_ID }}

defaults:
  run:
    working-directory: keikiapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: keikiapp-android-apk
          path: keikiapp/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign $DART_DEFINES
      - run: cd build/ios/iphoneos && zip -qry Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: keikiapp-ios-unsigned
          path: keikiapp/build/ios/iphoneos/Runner.app.zip
